<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
<meta name="theme-color" content="#000000">
<meta name="description" content="11:11e Deutsch Lernen — an offline German vocabulary learning game.">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="11:11e Deutsch Lernen">
<title>11:11e Deutsch Lernen — German Vocabulary Game</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<style>
:root{
  --ink:#000000;
  --surface:#0b0b0b;
  --surface-2:#151515;
  --surface-raised:#1f1f1f;
  --line:#2d2d2d;
  --gold:#d6b05e;
  --gold-dim:#8e743a;
  --teal:#4aa3a2;
  --green:#48b57a;
  --red:#d86b66;
  --text:#ffffff;
  --text-dim:#c8c8c8;
  --text-faint:#8c8c8c;
  --radius:14px;
  --shadow:0 10px 30px rgba(0,0,0,.42);
  --font-display: 'Fraunces', Georgia, serif;
  --font-body: 'Public Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
  --font-mono: 'IBM Plex Mono', 'SFMono-Regular', Consolas, monospace;
}
[data-theme="light"]{
  --ink:#ffffff;
  --surface:#ffffff;
  --surface-2:#f6f6f6;
  --surface-raised:#ffffff;
  --line:#dedede;
  --gold:#8a6420;
  --gold-dim:#a17e38;
  --teal:#287d7b;
  --green:#198754;
  --red:#b42318;
  --text:#000000;
  --text-dim:#3f3f3f;
  --text-faint:#737373;
  --shadow:0 10px 30px rgba(0,0,0,.12);
}
*{box-sizing:border-box; -webkit-tap-highlight-color: transparent;}
html,body{height:100%;}
body{
  margin:0;
  background:var(--ink);
  color:var(--text);
  font-family:var(--font-body);
  overflow-x:hidden;
  transition: background .3s ease, color .3s ease;
}
#app{max-width:900px; margin:0 auto; min-height:100vh; display:flex; flex-direction:column; position:relative;}

h1,h2,h3,.display{font-family:var(--font-display); font-weight:600; letter-spacing:-.01em;}

button{font-family:var(--font-body); cursor:pointer; border:none; background:none; color:inherit;}
button:focus-visible, a:focus-visible, [tabindex]:focus-visible{outline:2px solid var(--gold); outline-offset:2px;}

.screen{padding:20px 18px 100px; animation: fadeIn .25s ease;}
@keyframes fadeIn{from{opacity:0; transform:translateY(6px);} to{opacity:1; transform:translateY(0);}}
@media (prefers-reduced-motion: reduce){ *{animation-duration:.001s !important; transition-duration:.001s !important;} }

/* ===== Top bar ===== */
.topbar{
  position:sticky; top:0; z-index:20;
  display:flex; align-items:center; justify-content:space-between;
  padding:14px 18px; background:linear-gradient(180deg, var(--ink) 70%, transparent);
  backdrop-filter: blur(6px);
}
.topbar .brand{display:flex; align-items:center; gap:10px;}
.topbar .brand .seal{width:34px; height:34px;}
  .topbar .brand-name{font-family:var(--font-display); font-size:1.05rem; font-weight:600; letter-spacing:.01em;}
  .topbar .brand-name strong{color:var(--gold); font-family:var(--font-mono); font-size:.92em; font-weight:600; margin-right:6px;}
.stat-pills{display:flex; gap:8px; align-items:center;}
.pill{
  display:flex; align-items:center; gap:5px;
  background:var(--surface-2); border:1px solid var(--line);
  padding:6px 10px; border-radius:999px; font-size:.8rem; font-family:var(--font-mono);
  color:var(--text-dim);
}
.pill.hearts{color:var(--red);}
.pill.gold{color:var(--gold);}
.icon-btn{
  width:38px; height:38px; border-radius:50%; display:flex; align-items:center; justify-content:center;
  background:var(--surface-2); border:1px solid var(--line); font-size:1.1rem;
}
.icon-btn:active{transform:scale(.93);}
.ui-icon{width:1.05em; height:1.05em; display:inline-block; flex:0 0 auto; vertical-align:-.16em; stroke:currentColor; fill:none; stroke-width:1.8; stroke-linecap:round; stroke-linejoin:round;}
.ui-icon-fill{fill:currentColor; stroke:none;}
.icon-btn .ui-icon{width:18px; height:18px;}
.qi .ui-icon{width:1.45rem; height:1.45rem; stroke-width:1.7;}
.ni .ui-icon{width:18px; height:18px;}
.setting-icon{display:inline-flex; align-items:center; color:var(--gold); margin-right:2px;}
.section-label-icon{display:flex; align-items:center; gap:7px;}
.section-label-icon .ui-icon{width:15px; height:15px; color:var(--gold);}
.setting-icon .ui-icon{width:16px; height:16px;}
.pill .ui-icon,.hud-pill .ui-icon{width:14px; height:14px;}
.streak-flame .ui-icon{width:25px; height:25px; color:var(--gold);}

/* ===== Home ===== */
.hero{
  padding:8px 4px 20px; text-align:left;
}
.hero .eyebrow{
  font-family:var(--font-mono); text-transform:uppercase; letter-spacing:.14em; font-size:.72rem;
  color:var(--gold); margin-bottom:6px;
}
.hero h1{font-size:1.9rem; margin:0 0 6px; line-height:1.1;}
.hero p{color:var(--text-dim); margin:0; font-size:.92rem;}

.streak-strip{
  display:flex; align-items:center; gap:10px; margin:16px 0 22px;
  background:var(--surface); border:1px solid var(--line); border-radius:var(--radius);
  padding:12px 14px;
}
.streak-flame{font-size:1.4rem;}
.xp-bar-wrap{flex:1;}
.xp-bar-track{height:6px; border-radius:4px; background:var(--surface-2); overflow:hidden; margin-top:5px;}
.xp-bar-fill{height:100%; background:linear-gradient(90deg,var(--gold-dim),var(--gold)); border-radius:4px; transition:width .5s ease;}
.xp-label{font-size:.72rem; color:var(--text-faint); font-family:var(--font-mono);}

.level-grid{display:grid; grid-template-columns:repeat(2,1fr); gap:12px; margin-bottom:22px;}
.level-card{
  position:relative; background:var(--surface); border:1px solid var(--line); border-radius:var(--radius);
  padding:18px 16px; text-align:left; overflow:hidden; transition:transform .15s ease, border-color .15s ease;
}
.level-card:active{transform:scale(.97);}
@media (hover:hover){
  .level-card:hover,.quick-tile:hover,.chapter-card:hover,.choice-btn:hover,.pair-item:hover{border-color:var(--gold);}
  .choice-btn.correct:hover{background:rgba(72,181,122,.26);}
  .choice-btn.incorrect:hover{background:rgba(216,107,102,.26);}
}
.level-card.locked{opacity:.5;}
.level-card .lv-name{font-family:var(--font-display); font-size:1.6rem; font-weight:700;}
.level-card .lv-sub{font-size:.72rem; color:var(--text-faint); font-family:var(--font-mono); margin-top:2px;}
.level-card .lv-progress{margin-top:10px; height:5px; background:var(--surface-2); border-radius:4px; overflow:hidden;}
.level-card .lv-progress i{display:block; height:100%; background:var(--teal);}
.level-card .lv-stamp{
  position:absolute; top:10px; right:10px; font-size:1.3rem; opacity:.8;
}

.quick-grid{display:grid; grid-template-columns:repeat(2,1fr); gap:10px;}
.quick-tile{
  display:flex; align-items:center; gap:10px;
  background:var(--surface); border:1px solid var(--line); border-radius:12px;
  padding:13px 12px; font-size:.88rem; text-align:left;
}
.quick-tile:active{transform:scale(.96);}
.quick-tile .qi{font-size:1.25rem;}
.quick-tile b{display:block; font-size:.88rem;}
.quick-tile span{font-size:.7rem; color:var(--text-faint);}

.section-label{
  font-family:var(--font-mono); text-transform:uppercase; letter-spacing:.12em; font-size:.72rem;
  color:var(--text-faint); margin:26px 0 12px;
}

/* ===== Back nav ===== */
.back-row{display:flex; align-items:center; gap:10px; margin-bottom:16px;}
.back-btn{
  display:flex; align-items:center; gap:6px; font-size:.85rem; color:var(--text-dim);
  background:var(--surface); border:1px solid var(--line); border-radius:999px; padding:7px 13px;
}
.back-btn:active{transform:scale(.95);}

/* ===== Chapter list ===== */
.chapter-list{display:flex; flex-direction:column; gap:10px;}
.chapter-card{
  display:flex; align-items:center; gap:14px;
  background:var(--surface); border:1px solid var(--line); border-radius:var(--radius);
  padding:14px 16px; text-align:left;
}
.chapter-card:active{transform:scale(.98);}
.chapter-card.locked{opacity:.48; cursor:not-allowed;}
.chapter-num{
  width:38px; height:38px; border-radius:10px; background:var(--surface-2); flex-shrink:0;
  display:flex; align-items:center; justify-content:center; font-family:var(--font-mono); font-weight:600; color:var(--gold);
}
.chapter-info{flex:1; min-width:0;}
.chapter-info .ct-title{font-weight:600; font-size:.95rem;}
.chapter-info .ct-sub{font-size:.72rem; color:var(--text-faint); margin-top:2px;}
.chapter-progress-ring{width:34px; height:34px; flex-shrink:0;}

/* ===== Study mode ===== */
.study-card{
  background:var(--surface); border:1px solid var(--line); border-radius:20px;
  padding:34px 24px; text-align:center; min-height:340px; display:flex; flex-direction:column; justify-content:center; gap:10px;
  box-shadow:var(--shadow);
}
.study-article{font-family:var(--font-mono); color:var(--gold); font-size:.9rem; letter-spacing:.06em;}
.study-word{font-family:var(--font-display); font-size:2.3rem; font-weight:700; line-height:1.1; word-break:break-word;}
.study-en{color:var(--text-dim); font-size:1.15rem; margin-top:2px;}
.study-meta{display:flex; gap:8px; justify-content:center; flex-wrap:wrap; margin-top:6px;}
.study-tag{font-size:.68rem; font-family:var(--font-mono); background:var(--surface-2); border:1px solid var(--line); border-radius:999px; padding:3px 10px; color:var(--text-faint);}
.study-example{margin-top:14px; font-size:.9rem; color:var(--text-dim); font-style:italic; line-height:1.5;}
.study-example small{display:block; font-style:normal; color:var(--text-faint); margin-top:3px;}
.study-nav{display:flex; align-items:center; justify-content:space-between; margin-top:18px; gap:10px;}
.nav-btn{
  width:52px; height:52px; border-radius:50%; background:var(--surface-2); border:1px solid var(--line);
  display:flex; align-items:center; justify-content:center; font-size:1.3rem; color:var(--text);
}
.nav-btn:active{transform:scale(.9);}
.nav-btn:disabled{opacity:.3;}
.study-progress-row{display:flex; align-items:center; gap:10px; margin-bottom:18px;}
.study-progress-track{flex:1; height:6px; background:var(--surface-2); border-radius:4px; overflow:hidden;}
.study-progress-fill{height:100%; background:var(--teal); transition:width .3s ease;}
.study-timer{font-family:var(--font-mono); font-size:.85rem; color:var(--text-faint); white-space:nowrap;}
.fav-toggle{position:absolute; top:16px; right:16px; font-size:1.3rem; background:none;}
.study-card-wrap{position:relative;}
.start-game-btn{
  display:block; width:100%; margin-top:20px; padding:16px; border-radius:14px;
  background:var(--gold); color:var(--ink); font-weight:700; font-size:1rem; text-align:center;
  font-family:var(--font-display);
}
.start-game-btn:active{transform:scale(.98);}

/* ===== Game HUD ===== */
.game-hud{display:flex; align-items:center; justify-content:space-between; margin-bottom:16px; gap:8px;}
.hud-group{display:flex; gap:8px; align-items:center;}
.hud-pill{font-family:var(--font-mono); font-size:.8rem; background:var(--surface); border:1px solid var(--line); border-radius:999px; padding:6px 11px; display:flex; align-items:center; gap:5px;}
.hud-pill.timer{color:var(--gold);}
.hud-pill.timer.low{color:var(--red); animation:pulse 1s infinite;}
@keyframes pulse{0%,100%{opacity:1;}50%{opacity:.4;}}
.hud-pill.score{color:var(--teal);}

/* ===== Memory match grid ===== */
.match-grid{display:grid; grid-template-columns:repeat(4,1fr); gap:10px;}
@media (min-width:600px){ .match-grid{grid-template-columns:repeat(5,1fr);} }
.memory-round-note{color:var(--text-faint); font-family:var(--font-mono); font-size:.7rem; letter-spacing:.04em; text-align:center; margin:-6px 0 12px;}
.flip-card{
  aspect-ratio:3/4; perspective:800px; cursor:pointer; position:relative;
}
.card-speak{position:absolute; z-index:4; right:8px; bottom:8px; width:30px; height:30px; border-radius:50%; background:var(--surface-2); border:1px solid var(--teal); color:var(--teal); font-size:.78rem; display:flex; align-items:center; justify-content:center;}
.card-speak:hover{background:var(--teal); color:var(--ink);}
.speak-btn,.game-speak-btn,.question-speak-btn,.pair-speak-btn{display:inline-flex; align-items:center; justify-content:center; gap:6px; border:1px solid var(--teal); color:var(--teal); background:var(--surface-2); border-radius:999px; padding:8px 12px; font:inherit; font-size:.74rem; cursor:pointer; transition:background-color .2s ease,color .2s ease,border-color .2s ease;}
.speak-btn:hover,.game-speak-btn:hover,.question-speak-btn:hover,.pair-speak-btn:hover{background:var(--teal); color:var(--ink);}
.study-audio{display:flex; justify-content:center; margin-top:14px;}
.question-word-row{display:flex; align-items:center; justify-content:center; gap:10px; flex-wrap:wrap;}
.question-speak-btn{width:36px; height:36px; padding:0; border-radius:50%;}
.memory-round-note{display:flex; align-items:center; justify-content:center; gap:10px; flex-wrap:wrap;}
.pair-choice-row{display:flex; align-items:stretch; gap:6px; margin-bottom:8px;}
.pair-choice-row .pair-item{flex:1; margin:0;}
.pair-speak-btn{width:40px; flex:0 0 40px; padding:0; border-radius:10px;}
.voice-setting-row{align-items:center;}
.voice-setting-row>span{flex:1;}
.voice-setting-row select{max-width:280px; margin-left:8px;}
.voice-setting-row .rbtn{padding:8px 12px; white-space:nowrap;}
.voice-setting-row .audio-select{max-width:280px;}
.card-back-text{display:flex; align-items:center; justify-content:center; width:100%; min-height:100%; padding:8px 34px 8px 8px;}
.backup-panel{background:var(--surface); border:1px solid var(--line); border-radius:16px; padding:16px; margin-top:20px;}
.backup-panel p{color:var(--text-dim); font-size:.8rem; line-height:1.45; margin:0 0 12px;}
.cloud-input{width:100%; background:var(--surface-2); color:var(--text); border:1px solid var(--line); border-radius:10px; padding:12px 13px; font:inherit; font-size:.84rem; margin-bottom:10px;}
.cloud-input:focus{border-color:var(--teal); outline:2px solid color-mix(in srgb,var(--teal) 25%,transparent);}
.backup-actions{display:grid; grid-template-columns:1fr 1fr; gap:9px;}
.backup-actions .rbtn{padding:11px 8px;}
.backup-actions label{cursor:pointer; display:block; text-align:center;}
.backup-file{display:block; width:100%; margin-top:10px; color:var(--text-faint); font-size:.75rem;}
@media(max-width:420px){.backup-actions{grid-template-columns:1fr;}}
.flip-inner{
  position:relative; width:100%; height:100%; transition:transform .4s cubic-bezier(.4,.1,.2,1); transform-style:preserve-3d;
}
.flip-card.flipped .flip-inner{transform:rotateY(180deg);}
.flip-card.matched .flip-inner{transform:rotateY(180deg);}
.flip-card.matched{opacity:.35; pointer-events:none;}
.flip-card.wrong .flip-inner{transform:rotateY(180deg);}
.flip-card.wrong .flip-back{background:rgba(220,107,101,.18); border-color:var(--red); color:var(--red);}
.flip-face{
  position:absolute; inset:0; backface-visibility:hidden; border-radius:12px;
  display:flex; align-items:center; justify-content:center; text-align:center; padding:6px;
  font-size:.8rem; font-weight:600; border:1px solid var(--line);
}
.flip-front{background:var(--surface-2); font-family:var(--font-display); font-size:1.4rem; color:var(--gold); padding:0; overflow:hidden;}
.flip-front img{display:block; width:100%; height:100%; object-fit:cover; object-position:center;}
.flip-back{background:var(--surface-raised); transform:rotateY(180deg); line-height:1.2;}
.flip-card.matched .flip-back{background:rgba(72,181,122,.20); border-color:var(--green); color:var(--green);}

/* ===== MCQ / choice list ===== */
.question-card{background:var(--surface); border:1px solid var(--line); border-radius:20px; padding:30px 22px; text-align:center; margin-bottom:20px; box-shadow:var(--shadow);}
.question-label{font-size:.72rem; font-family:var(--font-mono); color:var(--text-faint); text-transform:uppercase; letter-spacing:.1em; margin-bottom:10px;}
.question-word{font-family:var(--font-display); font-size:2rem; font-weight:700;}
.game-audio-bar{display:flex; justify-content:center; margin:-8px 0 16px;}
.choice-list{display:flex; flex-direction:column; gap:10px;}
.choice-btn{
  width:100%; min-height:52px; display:flex; align-items:center;
  background:var(--surface); border:1px solid var(--line); border-radius:12px; padding:15px 16px;
  text-align:left; font-size:.95rem; line-height:1.25;
  transition:background-color .2s ease, border-color .2s ease, color .2s ease, opacity .2s ease;
}
/* Keep answer buttons in place: feedback changes color only, never size or position. */
.choice-btn:active{transform:none;}
.choice-btn.correct{background:rgba(72,181,122,.20); border-color:var(--green); color:var(--green);}
.choice-btn.incorrect{background:rgba(220,107,101,.20); border-color:var(--red); color:var(--red);}
.choice-btn.dim{opacity:.42;}
.choice-btn:disabled{pointer-events:none; cursor:default;}

/* ===== Word-pair matching ===== */
.pair-cols{display:grid; grid-template-columns:1fr 1fr; gap:10px;}
.pair-item{min-height:48px; background:var(--surface); border:1px solid var(--line); border-radius:12px; padding:13px 12px; font-size:.85rem; text-align:center; line-height:1.25; transition:background-color .2s ease, border-color .2s ease, color .2s ease, opacity .2s ease;}
.pair-item.selected{border-color:var(--gold); background:rgba(138,164,255,.15);}
.pair-item.matched{background:rgba(72,181,122,.20); border-color:var(--green); color:var(--green); opacity:.72; pointer-events:none;}
/* Wrong pairs stay still and red until the next attempt. */
.pair-item.wrong{background:rgba(220,107,101,.20); border-color:var(--red); color:var(--red);}


/* ===== Result screen ===== */
.result-hero{text-align:center; padding:24px 10px 10px;}
.result-emoji{font-size:3.4rem;}
.result-title{font-family:var(--font-display); font-size:1.7rem; font-weight:700; margin:8px 0 2px;}
.result-sub{color:var(--text-dim); font-size:.9rem;}
.perfect-banner{
  margin:16px 0; padding:12px; text-align:center; border-radius:12px;
  background:linear-gradient(90deg, rgba(138,164,255,.18), rgba(138,164,255,.05));
  border:1px solid var(--gold); color:var(--gold); font-family:var(--font-mono); font-size:.82rem; letter-spacing:.05em;
}
.result-stats{display:grid; grid-template-columns:repeat(3,1fr); gap:10px; margin:18px 0;}
.rstat{background:var(--surface); border:1px solid var(--line); border-radius:12px; padding:14px 8px; text-align:center;}
.rstat b{display:block; font-family:var(--font-mono); font-size:1.25rem; color:var(--gold);}
.rstat span{font-size:.68rem; color:var(--text-faint);}
.mistake-list{display:flex; flex-direction:column; gap:8px; margin:14px 0;}
.mistake-row{display:flex; justify-content:space-between; background:var(--surface); border:1px solid var(--line); border-radius:10px; padding:10px 13px; font-size:.85rem;}
.mistake-row .de{font-weight:600;}
.mistake-row .en{color:var(--text-faint);}
.result-btn-grid{display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-top:18px;}
.rbtn{padding:14px; border-radius:12px; text-align:center; font-weight:600; font-size:.88rem; border:1px solid var(--line); background:var(--surface);}
.rbtn.primary{background:var(--gold); color:var(--ink); border-color:var(--gold);}
.rbtn:active{transform:scale(.97);}

/* ===== Hearts / paywall modal ===== */
.modal-backdrop{position:fixed; inset:0; background:rgba(0,0,0,.55); display:flex; align-items:center; justify-content:center; z-index:100; padding:20px;}
.modal-card{background:var(--surface); border:1px solid var(--line); border-radius:18px; padding:28px 22px; max-width:360px; width:100%; text-align:center; box-shadow:var(--shadow);}
.modal-emoji{font-size:2.6rem; margin-bottom:8px;}
.modal-card h3{font-family:var(--font-display); font-size:1.3rem; margin:0 0 8px;}
.modal-card p{color:var(--text-dim); font-size:.87rem; margin:0 0 18px;}
.modal-btn{display:block; width:100%; padding:14px; border-radius:12px; font-weight:600; margin-bottom:10px;}
.modal-btn.watch{background:var(--gold); color:var(--ink);}
.modal-btn.wait{background:var(--surface-2); color:var(--text-dim); border:1px solid var(--line);}

/* ===== Difficult words / list screens ===== */
.word-row{
  display:flex; align-items:center; justify-content:space-between; gap:10px;
  background:var(--surface); border:1px solid var(--line); border-radius:12px; padding:13px 14px; margin-bottom:9px;
}
.word-row .wr-main .de{font-weight:600; font-size:.95rem;}
.word-row .wr-main .en{font-size:.78rem; color:var(--text-faint);}
.word-row .wr-side{display:flex; align-items:center; gap:8px;}
.search-result-row{display:flex; align-items:flex-start; justify-content:space-between; gap:12px; background:var(--surface); border:1px solid var(--line); border-left:3px solid var(--green); border-radius:12px; padding:14px; margin-bottom:10px;}
.search-result-main{min-width:0; flex:1;}
.search-result-head{display:flex; align-items:center; justify-content:space-between; gap:10px; flex-wrap:wrap;}
.search-result-head .de{font-size:1rem; font-weight:700;}

.search-details,.search-location{color:var(--text-faint); font-size:.7rem; margin-top:8px; line-height:1.4;}

.quote-card{background:linear-gradient(135deg,color-mix(in srgb,var(--teal) 12%,var(--surface)),var(--surface)); border:1px solid color-mix(in srgb,var(--teal) 45%,var(--line)); border-radius:14px; padding:16px; margin:16px 0;}

.daily-score-card{display:grid; grid-template-columns:repeat(3,1fr); gap:8px; margin:16px 0;}
.daily-score-card>div{background:var(--surface); border:1px solid var(--line); border-radius:12px; padding:12px 8px; text-align:center;}
.daily-score-card b{display:block; color:var(--gold); font-size:1.1rem;}
.daily-score-card span{display:block; color:var(--text-faint); font-size:.68rem; margin-top:4px;}
.daily-bonus{background:color-mix(in srgb,var(--gold) 18%,var(--surface)); border:1px solid var(--gold); color:var(--text); border-radius:12px; padding:12px 14px; margin:12px 0; text-align:center;}
.about-card{background:var(--surface); border:1px solid var(--line); border-radius:16px; padding:20px; line-height:1.7;}
.about-card h2{margin-top:0; color:var(--gold);}
.about-card p{margin:0 0 14px; color:var(--text-dim);}
.about-card strong{color:var(--text);}
.contact-link{color:var(--teal); text-decoration:underline; text-underline-offset:3px;}
.about-divider{height:1px; background:var(--line); margin:22px 0;}
.about-quote{margin:12px 0; padding:12px 14px; border-left:3px solid var(--gold); background:var(--surface-2); color:var(--text); font-family:var(--font-display); line-height:1.5;}
.about-meta{margin-top:18px; color:var(--text-faint); font-family:var(--font-mono); font-size:.68rem;}
.leaderboard-note{color:var(--text-faint); font-size:.78rem; line-height:1.4; margin-bottom:14px;}
.diff-badge{font-family:var(--font-mono); font-size:.68rem; padding:3px 8px; border-radius:999px;}
.diff-badge.high{background:rgba(220,107,101,.18); color:var(--red);}
.diff-badge.med{background:rgba(138,164,255,.18); color:var(--gold);}
.diff-badge.low{background:rgba(91,141,239,.18); color:var(--teal);}
.star-btn{font-size:1.1rem;}
.filter-row{display:flex; gap:8px; overflow-x:auto; margin-bottom:16px; padding-bottom:4px;}
.filter-chip{flex-shrink:0; font-size:.78rem; padding:7px 14px; border-radius:999px; background:var(--surface); border:1px solid var(--line); color:var(--text-dim); font-family:var(--font-mono);}
.filter-chip.active{background:var(--gold); color:var(--ink); border-color:var(--gold);}

/* ===== Profile ===== */
.profile-hero{text-align:center; padding:10px 0 20px;}
.avatar-seal{
  width:84px; height:84px; border-radius:50%; margin:0 auto 12px; display:flex; align-items:center; justify-content:center; overflow:hidden;
  background:radial-gradient(circle at 35% 30%, var(--gold), var(--gold-dim)); font-family:var(--font-display); font-size:2rem; font-weight:700; color:var(--ink);
  box-shadow:var(--shadow);
}
.avatar-seal img{width:100%; height:100%; object-fit:cover; display:block;}
.photo-form{display:flex; justify-content:center; gap:8px; align-items:center; flex-wrap:wrap; margin:10px auto 0;}
.photo-form label{background:var(--surface-2); color:var(--teal); border:1px solid var(--teal); border-radius:9px; padding:8px 11px; cursor:pointer; font-size:.75rem;}
.photo-form input{display:none;}
.photo-clear{color:var(--red); border:1px solid color-mix(in srgb,var(--red) 45%,var(--line)); border-radius:9px; padding:8px 11px; font-size:.75rem;}
.profile-name{font-family:var(--font-display); font-size:1.5rem; font-weight:700;}
.profile-level{color:var(--text-faint); font-family:var(--font-mono); font-size:.82rem; margin-top:2px;}
.badge-row{display:flex; gap:8px; justify-content:center; flex-wrap:wrap; margin-top:14px;}
.badge-chip{font-size:.75rem; background:var(--surface); border:1px solid var(--line); border-radius:999px; padding:6px 12px; display:flex; align-items:center; gap:5px;}
.stat-grid{display:grid; grid-template-columns:repeat(2,1fr); gap:10px; margin:20px 0;}
.big-stat{background:var(--surface); border:1px solid var(--line); border-radius:14px; padding:16px; text-align:center;}
.big-stat b{display:block; font-family:var(--font-mono); font-size:1.4rem; color:var(--gold);}
.big-stat span{font-size:.72rem; color:var(--text-faint);}
.settings-row{display:flex; align-items:center; justify-content:space-between; background:var(--surface); border:1px solid var(--line); border-radius:12px; padding:14px 16px; margin-bottom:10px; font-size:.9rem;}
.toggle{width:46px; height:26px; border-radius:14px; background:var(--surface-2); border:1px solid var(--line); position:relative; flex-shrink:0;}
.toggle.on{background:var(--gold);}
.toggle i{position:absolute; top:2px; left:2px; width:20px; height:20px; border-radius:50%; background:var(--text); transition:transform .2s ease;}
.toggle.on i{transform:translateX(20px); background:var(--ink);}
.locked-note{text-align:center; color:var(--text-faint); font-size:.8rem; margin-top:6px;}

/* ===== Bottom nav ===== */
.bottom-nav{
  position:fixed; bottom:0; left:0; right:0; z-index:20;
  max-width:900px; margin:0 auto;
  display:flex; background:var(--surface); border-top:1px solid var(--line);
  padding:8px 6px calc(8px + env(safe-area-inset-bottom));
}
.nav-item{flex:1; display:flex; flex-direction:column; align-items:center; gap:3px; padding:6px 2px; font-size:.62rem; color:var(--text-faint);}
.nav-item .ni{font-size:1.25rem;}
.nav-item.active{color:var(--gold);}

.empty-state{text-align:center; padding:50px 20px; color:var(--text-faint);}
.empty-state .ee{font-size:2.4rem; display:block; margin-bottom:10px;}

.leader-row{display:flex; align-items:center; gap:12px; background:var(--surface); border:1px solid var(--line); border-radius:12px; padding:12px 14px; margin-bottom:8px;}
.leader-rank{font-family:var(--font-mono); width:26px; text-align:center; color:var(--text-faint); font-weight:700;}
.leader-name{flex:1; font-weight:600; font-size:.9rem;}
.leader-xp{font-family:var(--font-mono); font-size:.78rem; color:var(--gold);}
.offline-banner{
  background:var(--surface-2); border:1px dashed var(--line); border-radius:12px; padding:12px 14px; font-size:.8rem; color:var(--text-faint); text-align:center; margin-bottom:16px;
}
.custom-panel{background:var(--surface); border:1px solid var(--line); border-radius:16px; padding:16px; margin-bottom:20px; box-shadow:var(--shadow);}
.custom-panel h2{font-size:1.15rem; margin:0 0 6px;}
.custom-panel p{color:var(--text-dim); font-size:.8rem; line-height:1.45; margin:0 0 14px;}
.custom-form{display:grid; gap:10px;}
.custom-form input,.custom-form textarea,.name-form input{width:100%; background:var(--surface-2); color:var(--text); border:1px solid var(--line); border-radius:10px; padding:12px 13px; font:inherit; font-size:.9rem;}
.custom-form textarea{min-height:96px; resize:vertical; line-height:1.45;}
.custom-form input:focus,.custom-form textarea:focus,.name-form input:focus{border-color:var(--gold); outline:2px solid color-mix(in srgb,var(--gold) 25%,transparent);}
.import-format{font-family:var(--font-mono); color:var(--text-faint); font-size:.7rem; background:var(--surface-2); border-left:3px solid var(--teal); padding:8px 10px; line-height:1.5;}
.custom-word-list{display:flex; flex-direction:column; gap:9px;}
.custom-word-row{display:flex; align-items:center; justify-content:space-between; gap:12px; background:var(--surface); border:1px solid var(--line); border-radius:12px; padding:12px 13px;}
.progress-overview{display:grid; grid-template-columns:repeat(2,1fr); gap:10px; margin:4px 0 22px;}
.progress-stat{background:var(--surface); border:1px solid var(--line); border-radius:14px; padding:14px 12px;}
.progress-stat strong{display:block; color:var(--gold); font-family:var(--font-mono); font-size:1.35rem;}
.progress-stat span{display:block; color:var(--text-faint); font-size:.7rem; margin-top:4px;}
.progress-section{margin-top:22px;}
.progress-chapter-row{background:var(--surface); border:1px solid var(--line); border-radius:12px; padding:12px 13px; margin-bottom:9px;}
.progress-chapter-head{display:flex; justify-content:space-between; gap:10px; align-items:baseline;}
.progress-chapter-name{font-weight:600; font-size:.88rem;}
.progress-chapter-count{color:var(--text-faint); font-family:var(--font-mono); font-size:.7rem; white-space:nowrap;}
.progress-track{height:7px; background:var(--surface-2); border-radius:99px; overflow:hidden; margin-top:9px;}
.progress-fill{height:100%; background:linear-gradient(90deg,var(--teal),var(--green)); border-radius:99px;}
.progress-chapter-foot{display:flex; justify-content:space-between; gap:8px; color:var(--text-faint); font-size:.68rem; margin-top:7px;}
.progress-due{color:var(--red);}
.progress-ready{color:var(--gold);}
@media(max-width:520px){.progress-overview{grid-template-columns:repeat(2,1fr);}}
.custom-word-row .de{font-weight:600;}
.custom-word-row .en{font-size:.78rem; color:var(--text-faint); margin-top:3px;}
.remove-word{color:var(--red); border:1px solid color-mix(in srgb,var(--red) 45%,var(--line)); border-radius:8px; padding:7px 9px; font-size:.75rem; flex-shrink:0;}
.name-form{display:flex; gap:8px; align-items:center; width:100%; max-width:420px; margin:12px auto 0;}
.name-form input{flex:1; min-width:0;}
.name-form button{background:var(--gold); color:var(--ink); border-radius:9px; padding:11px 14px; font-size:.82rem; font-weight:700;}
.name-lock-badge{background:color-mix(in srgb,var(--green) 16%,var(--surface)); border:1px solid var(--green); color:var(--green); border-radius:9px; padding:10px 12px; font-size:.78rem; white-space:nowrap;}
.audio-range{width:120px; accent-color:var(--teal); vertical-align:middle; margin-left:8px;}
.audio-select{margin-left:8px; background:var(--surface-2); color:var(--text); border:1px solid var(--line); border-radius:8px; padding:8px 10px; font:inherit; font-size:.8rem;}
.accent-picker{width:42px; height:30px; padding:2px; border-radius:8px; border:1px solid var(--line); background:var(--surface-2); cursor:pointer;}
.developer-panel{background:var(--surface); border:1px solid color-mix(in srgb,var(--gold) 45%,var(--line)); border-radius:16px; padding:16px; margin-top:10px; box-shadow:var(--shadow);}

.developer-heading>div{flex:1; min-width:0;}
.developer-heading strong{display:block; color:var(--gold); font-family:var(--font-display); font-size:1rem;}
.developer-heading small{display:block; color:var(--text-faint); font-size:.7rem; margin-top:3px; line-height:1.4;}
.developer-mark{font-size:1.45rem;}
.developer-login{display:flex; gap:8px; margin-top:12px;}

.developer-form-grid{display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-top:12px;}
.developer-form-grid label,.developer-batch-label{display:block; color:var(--text-dim); font-size:.72rem; font-weight:600;}
.developer-form-grid label:last-child{grid-column:1/-1;}

.developer-batch-label{margin-top:10px;}

.special-role-banner small{width:100%; color:var(--text-faint); font-size:.65rem; letter-spacing:.04em; text-transform:uppercase;}
.special-role-icon{font-size:1.15rem; filter:drop-shadow(0 0 5px var(--special-glow-strong));}
.special-badge{border-color:var(--special-glow) !important; color:var(--special-glow) !important; box-shadow:0 0 13px var(--special-glow-soft);}

.role-badge{display:block; width:100%; color:var(--green); font-size:.72rem; margin-top:2px;}
@media(max-width:520px){.developer-login,.developer-form-grid,.developer-actions{grid-template-columns:1fr; flex-direction:column;}.developer-form-grid label:last-child{grid-column:auto;}.developer-heading{align-items:flex-start;}.assigned-row{align-items:flex-start;}}
.settings-row>span{display:flex; align-items:center; gap:8px; flex-wrap:wrap;}
@media(max-width:520px){.name-form{flex-direction:column; align-items:stretch;}.name-form button{width:100%;}}

.toast{
  position:fixed; bottom:90px; left:50%; transform:translateX(-50%); background:var(--surface-raised); border:1px solid var(--line);
  padding:10px 18px; border-radius:999px; font-size:.82rem; box-shadow:var(--shadow); z-index:200; opacity:0; pointer-events:none; transition:opacity .25s ease, transform .25s ease;
}
.toast.show{opacity:1; transform:translateX(-50%) translateY(-6px);}

::-webkit-scrollbar{width:6px; height:6px;}
::-webkit-scrollbar-thumb{background:var(--line); border-radius:3px;}

<script>
/* ============================================================
   CORE: storage, player state, difficulty/spaced-repetition engine
   ============================================================ */
const STORAGE_KEY = 'gvg_state_v1';
const TODAY = () => new Date().toISOString().slice(0,10);

function defaultState(){
  return {
    profile: { name:'Learner', avatarLetter:'L', avatarData:null, playerId:'', nameLocked:false, createdAt: Date.now() },
    settings: { theme:'dark', accentColor:'#d6b05e', sound:true, soundVolume:.7, soundStyle:'chime', voiceRate:.88, voiceName:'', voiceStyle:'warm', specialGlowColor:'#d6b05e', specialGlowIntensity:72, specialGlowSpeed:'calm', specialGlowStyle:'pulse', difficulty:'normal', streakReminders:false, lastStreakReminderDate:null },
    hearts: { count:20, lastReset: TODAY(), lastRefillAt: Date.now() },
    xp: { total:0 },
    streak: { current:0, longest:0, lastActiveDay: null },
    stats: {
      gamesPlayed:0, gamesCompleted:0, perfectGames:0,
      totalCorrect:0, totalWrong:0, bestScore:0, bestTimeMs:null,
      wordsMastered:0
    },
    favorites: {},          // id -> true
    customWords: [],        // user-created {id,de,en,article,ex}
    chapterProgress: {},    // `${level}-${chapter}` -> {completedIds,currentBatchIds,completed}
    cloudSync: { endpoint:'', lastSyncedAt:null },
    dailyChallenge: {lastDate:null, streak:0, bestScore:0, bestAccuracy:0, leaderboard:[]},
    leaderboard: [],
    wordStats: {},          // id -> {seen,correct,wrong,streakCorrect,streakWrong,difficulty,lastSeen,nextReview}
    achievements: {},       // id -> {unlockedAt}
    history: [],            // last N game results
    developer: { privilegedPlayers:{}, grantedBatches:{} }
  };
}

function loadState(){
  try{
    const raw = localStorage.getItem(STORAGE_KEY);
    if(!raw) return defaultState();
    const parsed = JSON.parse(raw);
    return Object.assign(defaultState(), parsed, {
      profile: Object.assign(defaultState().profile, parsed.profile, {nameLocked: typeof parsed.profile?.nameLocked==='boolean' ? parsed.profile.nameLocked : !!(parsed.profile?.name && parsed.profile.name!=='Learner')}),
      settings: Object.assign(defaultState().settings, parsed.settings),
      hearts: Object.assign(defaultState().hearts, parsed.hearts),
      developer: Object.assign(defaultState().developer, parsed.developer || {}, {privilegedPlayers:Object.assign({}, parsed.developer?.privilegedPlayers || {}), grantedBatches:Object.assign({}, parsed.developer?.grantedBatches || {})}),
      xp: Object.assign(defaultState().xp, parsed.xp),
      streak: Object.assign(defaultState().streak, parsed.streak),
      stats: Object.assign(defaultState().stats, parsed.stats),
      favorites: parsed.favorites || {},
      customWords: Array.isArray(parsed.customWords) ? parsed.customWords : [],
      chapterProgress: parsed.chapterProgress || {},
      cloudSync: Object.assign(defaultState().cloudSync, parsed.cloudSync || {}),
      dailyChallenge: Object.assign(defaultState().dailyChallenge, parsed.dailyChallenge || {}, {leaderboard:Array.isArray(parsed.dailyChallenge?.leaderboard)?parsed.dailyChallenge.leaderboard:[]}),
      leaderboard: Array.isArray(parsed.leaderboard) ? parsed.leaderboard : [],
      wordStats: parsed.wordStats || {},
      achievements: parsed.achievements || {},
      history: parsed.history || []
    });
  }catch(e){
    console.warn('State load failed, using default', e);
    return defaultState();
  }
}

let STATE = loadState();
let saveTimer = null;
let developerUnlocked = false;

function makePlayerId(){
  const token = (window.crypto && typeof window.crypto.randomUUID==='function') ? window.crypto.randomUUID().replace(/-/g,'').slice(0,10) : Math.random().toString(36).slice(2,12);
  return `P-${String(token).toUpperCase()}`;
}
function ensurePlayerIdentity(){
  if(!STATE.profile.playerId){ STATE.profile.playerId = makePlayerId(); saveState(); }
  if(!STATE.developer || typeof STATE.developer!=='object') STATE.developer = {privilegedPlayers:{}, grantedBatches:{}};
  if(!STATE.developer.privilegedPlayers) STATE.developer.privilegedPlayers = {};
  if(!STATE.developer.grantedBatches) STATE.developer.grantedBatches = {};
}
ensurePlayerIdentity();
function saveState(){
  clearTimeout(saveTimer);
  saveTimer = setTimeout(()=>{
    try{ localStorage.setItem(STORAGE_KEY, JSON.stringify(STATE)); }
    catch(e){ console.warn('Save failed', e); }
  }, 120);
}

function learningBackupPayload(){
  const masteredVocabulary = wordsAllLevels().filter(w=>STATE.wordStats[w.id] && STATE.wordStats[w.id].mastered).map(w=>({
    id:w.id, de:w.de, en:w.en, level:w.level, chapter:w.chapter, chapterTitle:w.chapterTitle
  }));
  return {
    format:'11:11e-deutsch-lernen-backup', version:2, exportedAt:new Date().toISOString(),
    profile:STATE.profile,
    stats:STATE.stats, wordStats:STATE.wordStats, chapterProgress:STATE.chapterProgress,
    customWords:STATE.customWords, favorites:STATE.favorites, achievements:STATE.achievements,

function base64Bytes(value){
  const raw = atob(value);
  return Uint8Array.from(raw, ch=>ch.charCodeAt(0));
}
function bytesBase64(bytes){
  let raw='';
  bytes.forEach(byte=>{ raw += String.fromCharCode(byte); });
  return btoa(raw);

async function developerPasswordDigest(password){
  if(!window.crypto?.subtle || typeof TextEncoder==='undefined') throw new Error('Secure browser cryptography is unavailable');
  const key = await crypto.subtle.importKey('raw', new TextEncoder().encode(password), {name:'PBKDF2'}, false, ['deriveBits']);

  return bytesBase64(new Uint8Array(bits));

function constantTimeTextEqual(left, right){
  if(left.length!==right.length) return false;
  let result=0;
  for(let i=0;i<left.length;i++) result |= left.charCodeAt(i)^right.charCodeAt(i);
  return result===0;
}

/* ---------- Daily reset (hearts + streak check) ---------- */
function checkDailyReset(){
  const today = TODAY();
  if(STATE.hearts.lastReset !== today){
    STATE.hearts.lastReset = today;
  }
  applyHeartRegeneration();
  // streak grace: if lastActiveDay is not today and not yesterday, reset streak
  if(STATE.streak.lastActiveDay){
    const last = new Date(STATE.streak.lastActiveDay);
    const now = new Date(today);
    const diffDays = Math.round((now-last)/86400000);
    if(diffDays > 1){ STATE.streak.current = 0; }
  }
  saveState();
}

function markActiveToday(){
  const today = TODAY();
  if(STATE.streak.lastActiveDay !== today){
    STATE.streak.current += 1;
    STATE.streak.longest = Math.max(STATE.streak.longest, STATE.streak.current);
    STATE.streak.lastActiveDay = today;
    STATE.settings.lastStreakReminderDate = null;
    saveState();
  }
}

function maybeNotifyStreakReminder(){
  if(!STATE.settings.streakReminders || typeof Notification==='undefined') return;

/* ---------- Hearts ---------- */
function refreshHeartDisplays(){
  document.querySelectorAll('[data-heart-count]').forEach(node=>{
    node.innerHTML = heartMarkup();
  });

function applyHeartRegeneration(){
  const hearts = STATE.hearts;
  const now = Date.now();
  if(hasUnlimitedHearts()){
    const changed = hearts.count !== MAX_HEARTS;
    hearts.count = MAX_HEARTS;
    hearts.lastRefillAt = now;
    if(changed) saveState();
    refreshHeartDisplays();
    return changed;
  }
  hearts.count = Math.max(0, Math.min(MAX_HEARTS, Math.floor(Number(hearts.count) || 0)));
  if(!Number.isFinite(hearts.lastRefillAt) || hearts.lastRefillAt<=0) hearts.lastRefillAt = now;
  if(hearts.count >= MAX_HEARTS){
    hearts.lastRefillAt = now;
    return false;
  }
  const gained = Math.floor((now - hearts.lastRefillAt) / HEART_REFILL_MS);
  if(gained<=0) return false;
  const previous = hearts.count;
  hearts.count = Math.min(MAX_HEARTS, hearts.count + gained);
  hearts.lastRefillAt = hearts.count >= MAX_HEARTS ? now : hearts.lastRefillAt + gained * HEART_REFILL_MS;
  saveState();
  refreshHeartDisplays();
  return hearts.count > previous;
}
function startHeartRegeneration(){
  clearInterval(heartRefillTimer);
  applyHeartRegeneration();
  heartRefillTimer = setInterval(applyHeartRegeneration, 1000);
}
function loseHeart(){
  if(hasUnlimitedHearts()){ STATE.hearts.count=MAX_HEARTS; refreshHeartDisplays(); return MAX_HEARTS; }
  applyHeartRegeneration();
  if(STATE.hearts.count > 0){ STATE.hearts.count -= 1; saveState(); refreshHeartDisplays(); }
  return STATE.hearts.count;
}

/* ---------- Word difficulty stats ---------- */
function getWordStat(id){
  if(!STATE.wordStats[id]){
    STATE.wordStats[id] = { seen:0, correct:0, wrong:0, streakCorrect:0, streakWrong:0, difficulty:1, lastSeen:null, nextReview:null };
  }
  return STATE.wordStats[id];
}

function recordAnswer(id, isCorrect){
  const s = getWordStat(id);
  s.seen += 1;
  s.lastSeen = Date.now();
  if(isCorrect){
    s.correct += 1;
    s.streakCorrect += 1;
    s.streakWrong = 0;
    // reduce difficulty gradually, floor 0
    const reduction = s.streakCorrect >= 5 ? 0.6 : s.streakCorrect >= 3 ? 0.4 : s.streakCorrect >= 1 ? 0.25 : 0;
    s.difficulty = Math.max(0, s.difficulty - reduction);
    // spaced repetition interval grows with streak
    const hours = [1,4,12,24,72,168,336][Math.min(s.streakCorrect,6)];
    s.nextReview = Date.now() + hours*3600*1000;
    STATE.stats.totalCorrect += 1;
  } else {
    s.wrong += 1;
    s.streakWrong += 1;
    s.streakCorrect = 0;
    s.difficulty = Math.min(6, s.difficulty + 1.5);
    s.nextReview = Date.now() + 30*60*1000; // review again soon (30 min)
    STATE.stats.totalWrong += 1;
  }
  if(s.seen >= 3 && s.correct/s.seen >= 0.8 && s.difficulty < 0.5){
    if(!s.mastered){ s.mastered = true; STATE.stats.wordsMastered += 1; }
  }
  saveState();
  return s;
}

function accuracyOf(s){ return s.seen ? Math.round((s.correct/s.seen)*100) : 100; }

function difficultyTier(s){
  if(s.difficulty >= 3.5) return 'high';
  if(s.difficulty >= 1.2) return 'med';
  return 'low';
}

/* weight used for weighted-random selection: higher = more likely to be picked */
function wordWeight(id){
  const s = STATE.wordStats[id];
  if(!s || s.seen === 0) return 3; // unseen words: moderate-high priority to introduce them
  let w = 1 + s.difficulty * 2.2;
  // recency boost: if overdue for review, boost further
  if(s.nextReview && Date.now() >= s.nextReview) w *= 1.6;
  // avoid starving very easy/mastered words completely
  return Math.max(0.35, w);
}

/* weighted sample without replacement */
function weightedSample(items, count, idFn){
  const pool = items.map(it => ({ it, w: wordWeight(idFn(it)) + Math.random()*0.75 }));
  pool.sort((a,b)=> b.w - a.w);
  // take a broader top slice then shuffle for variety, avoiding pure rank order
  const sliceSize = Math.min(pool.length, Math.max(count*2, count+4));
  const top = pool.slice(0, sliceSize).map(p=>p.it);
  shuffle(top);
  return top.slice(0, Math.min(count, top.length));
}

function shuffle(arr){
  for(let i=arr.length-1;i>0;i--){
    const j = Math.floor(Math.random()*(i+1));
    [arr[i],arr[j]]=[arr[j],arr[i]];
  }
  return arr;
}

<script>
/* ============================================================
   GAME ENGINE: word pools + session controller for all modes
   ============================================================ */

function allChaptersFor(levelKey){ return VOCAB_DB[levelKey] || []; }

function wordsForChapter(levelKey, chapterNum){
  const ch = allChaptersFor(levelKey).find(c=>c.chapter===chapterNum);
  if(!ch) return [];
  return ch.words.map(w => Object.assign({}, w, {level:levelKey, chapter:ch.chapter, chapterTitle:ch.title}));
}

function chapterProgressKey(level, chapter){ return `${level}-${chapter}`; }
function getChapterProgress(level, chapter){
  const key = chapterProgressKey(level, chapter);
  if(!STATE.chapterProgress[key]){
    STATE.chapterProgress[key] = {completedIds:[], currentBatchIds:[], completed:false};
  }
  const p = STATE.chapterProgress[key];
  p.completedIds = Array.isArray(p.completedIds) ? p.completedIds : [];
  p.currentBatchIds = Array.isArray(p.currentBatchIds) ? p.currentBatchIds : [];
  p.completed = !!p.completed;
  return p;
}
function isChapterUnlocked(level, chapter){
  if(canJumpLevels()) return true;
  if(chapter <= 1) return true;
  return !!getChapterProgress(level, chapter-1).completed;
}
function chapterBatchWords(level, chapter){
  const pool = wordsForChapter(level, chapter);
  const progress = getChapterProgress(level, chapter);
  if(progress.completed && !canJumpLevels()) return [];
  if(progress.completed && canJumpLevels()){ progress.completed=false; progress.currentBatchIds=[]; }
  const byId = new Map(pool.map(w=>[w.id,w]));
  const saved = progress.currentBatchIds.map(id=>byId.get(id)).filter(Boolean);
  if(saved.length) return saved;

  const completed = new Set(progress.completedIds);
  const newWords = pool.filter(w=>!completed.has(w.id));
  const reviewWords = pool.filter(w=>{
    if(!completed.has(w.id)) return false;
    const s = STATE.wordStats[w.id];
    // A recent mistake returns in the next batch; later correct answers wait
    // until their scheduled nextReview time, implementing spaced repetition.
    return s && (s.streakWrong>0 || (s.nextReview && Date.now()>=s.nextReview));
  });
  const batchSize = Math.min(15, reviewWords.length + newWords.length);
  // Always include due/incorrect words first, then use unseen chapter words
  // to fill the remaining slots. This guarantees mistakes return in the next
  // review batch instead of merely receiving a small random weight boost.
  const reviewBatch = weightedSample(reviewWords, Math.min(batchSize, reviewWords.length), w=>w.id);
  const selected = new Set(reviewBatch.map(w=>w.id));
  const newFillPool = newWords.filter(w=>!selected.has(w.id));
  const newFill = weightedSample(newFillPool, batchSize-reviewBatch.length, w=>w.id);
  const batch = shuffle([...reviewBatch, ...newFill]);
  progress.currentBatchIds = batch.map(w=>w.id);
  saveState();
  return batch;
}

function wordsForLevel(levelKey){
  const out = [];
  for(const ch of allChaptersFor(levelKey)){
    for(const w of ch.words) out.push(Object.assign({}, w, {level:levelKey, chapter:ch.chapter, chapterTitle:ch.title}));
  }
  return out;
}

function wordsCustom(){
  return STATE.customWords.map(w=>Object.assign({}, w, {
    level:'Custom', chapter:1, chapterTitle:'My Vocabulary', pos:w.pos||'custom'
  }));
}

function parseCustomVocabulary(raw){
  const seen = new Set();
  const parsed = [];
  String(raw||'').split(/\r?\n/).forEach((line, index)=>{
    const clean = line.trim();
    if(!clean || clean.startsWith('#')) return;
    // Accept TSV, CSV, semicolon, pipe, equals, or “German - English” lines.
    const parts = clean.split(/\t|;|\||=|\s+[–—-]\s+/).map(v=>v.trim()).filter(Boolean);
    if(parts.length < 2) return;
    const de = parts[0], en = parts.slice(1).join(' — ');
    const key = `${de.toLocaleLowerCase()}|${en.toLocaleLowerCase()}`;
    if(seen.has(key)) return;
    seen.add(key);
    parsed.push({id:`custom-${Date.now()}-${index}-${Math.random().toString(36).slice(2,7)}`, de, en, pos:'custom'});
  });
  return parsed;
}

function importCustomVocabulary(){
  const input = document.getElementById('customImportInput');
  const words = parseCustomVocabulary(input ? input.value : '');
  if(!words.length){
    toast('Use one word pair per line: German — English');
    return;
  }
  const existing = new Set(STATE.customWords.map(w=>`${w.de.toLocaleLowerCase()}|${w.en.toLocaleLowerCase()}`));
  const fresh = words.filter(w=>{
    const key = `${w.de.toLocaleLowerCase()}|${w.en.toLocaleLowerCase()}`;
    if(existing.has(key)) return false;
    existing.add(key);
    return true;
  });
  STATE.customWords.push(...fresh);
  saveState();
  if(input) input.value = '';
  render();
  toast(`${fresh.length} word${fresh.length===1?'':'s'} added`);
}

function importVocabularyFile(file){
  if(!file) return;
  const reader = new FileReader();
  reader.onload = ()=>{
    const input = document.getElementById('customImportInput');
    if(input) input.value = reader.result;
    toast('File loaded — review it, then tap Import words');
  };
  reader.onerror = ()=>toast('Could not read that file');
  reader.readAsText(file);
}

function removeCustomWord(id){
  STATE.customWords = STATE.customWords.filter(w=>w.id!==id);
  delete STATE.favorites[id];
  delete STATE.wordStats[id];
  saveState();
  render();
  toast('Word removed');
}

function startCustomPractice(){
  const pool = wordsCustom();
  if(!pool.length){ toast('Add some words first'); return; }
  studyCtx = {pool, idx:0, levelLabel:'My Vocabulary', source:{type:'custom'}};
  navigate('modeSelect', {});
}

function wordsAllLevels(){
  const out = [];
  for(const lv of Object.keys(VOCAB_DB)) out.push(...wordsForLevel(lv));
  out.push(...wordsCustom());
  return out;
}

function wordsFavorites(){
  return wordsAllLevels().filter(w => isFavorite(w.id));
}

function wordsDifficult(levelKey){
  let pool = levelKey ? wordsForLevel(levelKey) : wordsAllLevels();
  return pool.filter(w=>{
    const s = STATE.wordStats[w.id];
    return s && s.seen>0 && difficultyTier(s) !== 'low';
  }).sort((a,b)=>{
    const sa = STATE.wordStats[a.id], sb = STATE.wordStats[b.id];
    return (sb.difficulty) - (sa.difficulty);
  });
}

function wordsMistakes(){
  return wordsAllLevels().filter(w=>{
    const s = STATE.wordStats[w.id];
    return s && s.streakWrong > 0;
  });
}

/* Difficulty-setting -> counts & time */
const DIFFICULTY_PRESETS = {
  easy:   { pairs:6,  mcqCount:8,  seconds: c => 30 + c*14, label:'Easy' },
  normal: { pairs:8,  mcqCount:10, seconds: c => 20 + c*10, label:'Normal' },
  hard:   { pairs:10, mcqCount:12, seconds: c => 12 + c*7,  label:'Hard' },
};

function pickRoundWords(pool, count){
  if(pool.length === 0) return [];
  if(pool.length <= count) return shuffle(pool.slice());
  return weightedSample(pool, count, w=>w.id);
}

/* Build distractors for MCQ from same pool where possible */
function buildDistractors(correct, pool, n, field){
  const others = pool.filter(w=>w.id!==correct.id && w[field] && w[field]!==correct[field]);
  shuffle(others);
  const picked = [];
  const seen = new Set([correct[field]]);
  for(const o of others){
    if(picked.length>=n) break;
    if(seen.has(o[field])) continue;
    seen.add(o[field]);
    picked.push(o);
  }
  return picked;
}

/* ============================================================
   SESSION: holds all state for one game run
   ============================================================ */
function createSession(mode, pool, difficulty, meta){
  const preset = DIFFICULTY_PRESETS[difficulty] || DIFFICULTY_PRESETS.normal;
  const isChapterBatch = !!(meta && meta.chapterSource && meta.chapterSource.type==='chapter');
  // Flip Card is intentionally a compact ten-word round at every difficulty.
  // Other modes continue to use their existing chapter-batch or difficulty counts.
  const count = mode==='memory' ? Math.min(10, pool.length) : (isChapterBatch ? pool.length : preset.mcqCount);
  const words = pickRoundWords(pool, count);
  const totalSeconds = preset.seconds(words.length);

  const session = {
    mode, difficulty, meta: meta||{},
    words: mode==='memory' ? words.slice(0,5) : words,
    memoryAllWords: mode==='memory' ? words.slice() : null,
    memorySection: mode==='memory' ? 1 : null,
    score: 0, combo: 0, maxCombo:0,
    correctCount: 0, wrongCount: 0,
    moves: 0,
    startTime: Date.now(),
    totalSeconds,
    remaining: totalSeconds,
    heartsLostThisGame: 0,
    finished: false,
    mistakeWords: [],   // word objects answered wrong
    correctWords: [],
    // mode-specific
    cards: null, cardsFlipped: [], matchedIds: new Set(),
    qIndex: 0, currentChoices: null, currentQuestion:null, answeredCurrent:false, feedbackLocked:false,
    pairLeft: null, pairRight: null, pairSelectedLeft:null, pairSelectedRight:null, pairWrong:null, pairMatched:new Set(),
  };

  if(mode === 'memory'){
    const cards = [];
    session.words.forEach(w=>{
      cards.push({cardId:w.id+'_de', wordId:w.id, text:w.de, side:'de'});
      cards.push({cardId:w.id+'_en', wordId:w.id, text:w.en, side:'en'});
    });
    shuffle(cards);
    session.cards = cards;
  } else if(mode === 'pairs'){
    const left = words.map(w=>({wordId:w.id, text:w.de, side:'de'}));
    const right = words.map(w=>({wordId:w.id, text:w.en, side:'en'}));
    shuffle(left); shuffle(right);
    session.pairLeft = left;
    session.pairRight = right;
  }
  // en2de, de2en, mcq: question-by-question, built lazily in getCurrentQuestion

  return session;
}

function getCurrentQuestion(session, fullPool){
  const w = session.words[session.qIndex];
  if(!w) return null;

  // Reuse the same question object while the screen is re-rendered. Without
  // this cache, the choices were reshuffled after an answer and the selected
  // option lost its feedback state.
  if(session.currentQuestion && session.currentQuestion.qIndex===session.qIndex){
    return session.currentQuestion;
  }

  let promptField, answerField;
  if(session.mode==='en2de'){ promptField='en'; answerField='de'; }
  else if(session.mode==='de2en'){ promptField='de'; answerField='en'; }
  else { // generic mcq: random direction each question
    if(session._mcqDir===undefined || session.qIndex!==session._mcqDirIdx){
      session._mcqDir = Math.random()<0.5?'de2en':'en2de';
      session._mcqDirIdx = session.qIndex;
    }
    if(session._mcqDir==='de2en'){ promptField='de'; answerField='en'; }
    else { promptField='en'; answerField='de'; }
  }
  const distractors = buildDistractors(w, fullPool, 3, answerField);
  const choices = shuffle([w, ...distractors]).map(c=>({wordId:c.id, text:c[answerField], _picked:false}));
  session.currentQuestion = {qIndex:session.qIndex, word:w, promptField, answerField, promptText:w[promptField], choices};
  return session.currentQuestion;
}

/* scoring helpers */
function scoreForCorrect(session, timeBonusFactor){
  const base = 100;
  const comboBonus = Math.min(session.combo, 10) * 10;
  return Math.round(base + comboBonus);
}

function applyCorrect(session, wordId){
  session.combo += 1;
  session.maxCombo = Math.max(session.maxCombo, session.combo);
  session.correctCount += 1;
  session.score += scoreForCorrect(session);
  const w = session.words.find(x=>x.id===wordId);
  if(w) session.correctWords.push(w);
  recordAnswer(wordId, true);
}

function applyWrong(session, wordId, removeHeart=true){
  session.combo = 0;
  session.wrongCount += 1;
  const w = session.words.find(x=>x.id===wordId);
  if(w && !session.mistakeWords.find(m=>m.id===w.id)) session.mistakeWords.push(w);
  recordAnswer(wordId, false);
  const remaining = removeHeart ? loseHeart() : STATE.hearts.count;
  if(removeHeart) session.heartsLostThisGame += 1;
  return remaining;
}

function isPerfectGame(session){
  return session.wrongCount === 0 && session.correctCount > 0;
}

function dailyWordHash(value, seed){
  let h = Number(seed) || 0;
  for(const ch of String(value)){ h = ((h << 5) - h + ch.charCodeAt(0)) | 0; }
  return Math.abs(h);
}
function dailyWordsFor(seed){
  return wordsAllLevels().slice().sort((a,b)=>dailyWordHash(a.id,seed)-dailyWordHash(b.id,seed));
}
function dayGap(from, to){
  if(!from || !to) return Infinity;
  return Math.round((new Date(to+'T00:00:00Z')-new Date(from+'T00:00:00Z'))/86400000);
}
function recordDailyChallengeResult(game, perfect){
  const daily = STATE.dailyChallenge;
  const date = game.meta.dailyDate || TODAY();
  let bonus = 0;
  if(daily.lastDate !== date){
    daily.streak = dayGap(daily.lastDate,date)===1 ? daily.streak+1 : 1;
    daily.lastDate = date;
    bonus = 50 + Math.min(daily.streak,30)*10 + (perfect ? 50 : 0);
  }
  game.dailyStreak = daily.streak;
  game.dailyBonus = bonus;
  game.score += bonus;
  const total = game.correctCount + game.wrongCount;
  const accuracy = total ? Math.round(game.correctCount/total*100) : 100;
  daily.bestScore = Math.max(daily.bestScore, game.score);
  daily.bestAccuracy = Math.max(daily.bestAccuracy, accuracy);
  daily.leaderboard = Array.isArray(daily.leaderboard) ? daily.leaderboard : [];
  const entry = {id:`${STATE.profile.name}-${date}`,name:STATE.profile.name,score:game.score,accuracy,streak:daily.streak,date};
  const existing = daily.leaderboard.findIndex(row=>row.id===entry.id);
  if(existing>=0) daily.leaderboard[existing] = Object.assign(daily.leaderboard[existing],entry);
  else daily.leaderboard.push(entry);
  daily.leaderboard.sort((a,b)=>b.score-a.score || b.accuracy-a.accuracy);
  daily.leaderboard = daily.leaderboard.slice(0,50);
  return bonus;
}

function finishSession(session){
  session.finished = true;
  session.durationMs = Date.now() - session.startTime;
  STATE.stats.gamesPlayed += 1;
  STATE.stats.gamesCompleted += 1;
  STATE.stats.bestScore = Math.max(STATE.stats.bestScore, session.score);
  if(STATE.stats.bestTimeMs===null || session.durationMs < STATE.stats.bestTimeMs){
    STATE.stats.bestTimeMs = session.durationMs;
  }
  const perfect = isPerfectGame(session);
  if(perfect) STATE.stats.perfectGames += 1;

  const dailyBonus = session.meta && session.meta.dailyChallenge ? recordDailyChallengeResult(session, perfect) : 0;
  let xpGain = session.correctCount * 8 + (perfect ? 60 : 0) + Math.round(session.score/20) + dailyBonus;
  addXp(xpGain);
  session.xpGain = xpGain;
  markActiveToday();
  STATE.history.unshift({
    mode:session.mode, score:session.score, accuracy: session.correctCount+session.wrongCount>0 ? Math.round(session.correctCount/(session.correctCount+session.wrongCount)*100):100,
    date: Date.now(), perfect, level: session.meta.levelLabel||''
  });
  STATE.history = STATE.history.slice(0,50);
  saveState();
  session.newAchievements = checkAchievements();
  session.perfect = perfect;
  return session;
}

  warm: {label:'Warm & friendly', rate:.88, pitch:.95, cues:/natural|neural|premium|enhanced|anna|helena|katja|conrad/i},
  clear: {label:'Clear & steady', rate:.92, pitch:.99, cues:/natural|neural|enhanced|quality|google|microsoft|deutsch|german/i},

};

/* ---------------- Natural German pronunciation ---------------- */
function refreshGermanVoiceCache(){
  if(!('speechSynthesis' in window)) return [];
  germanVoiceCache = speechSynthesis.getVoices().filter(v=>/^de([_-]|$)/i.test(v.lang));
  return germanVoiceCache;
}
function germanVoices(){ return germanVoiceCache.length ? germanVoiceCache : refreshGermanVoiceCache(); }
function germanVoiceScore(v){
  const name = String(v.name||'');
  const lang = String(v.lang||'').toLowerCase();
  const style = currentVoiceStyle();
  let score = 0;
  if(v.localService) score += 24;
  if(v.default) score += 10;
  if(lang === 'de-de') score += 18;
  else if(/^de[-_]de/.test(lang)) score += 12;
  else if(/^de([_-]|$)/.test(lang)) score += 6;
  if(/natural|neural|premium|enhanced|quality|high.?quality/i.test(name)) score += 30;
  if(/google deutsch|microsoft.*(german|katja|conrad|anna|helena)|deutsch/i.test(name)) score += 12;
  if(style.cues.test(name)) score += 16;
  if(/compact|espeak|festival|robot/i.test(name)) score -= 8;
  return score;
}
function preferredGermanVoice(){
  const voices = germanVoices();
  const saved = STATE.settings.voiceName || '';
  return voices.find(v=>v.name===saved) || voices.slice().sort((a,b)=>germanVoiceScore(b)-germanVoiceScore(a))[0] || null;
}
function voiceOptionsHtml(){
  const voices = germanVoices();
  const auto = `<option value="" ${STATE.settings.voiceName?'':'selected'}>Automatic (best available)</option>`;
  if(!voices.length) return auto + '<option value="" disabled>No installed German voice detected</option>';
  return auto + voices.map(v=>`<option value="${escapeHtml(v.name)}" ${STATE.settings.voiceName===v.name?'selected':''}>${escapeHtml(v.name)} · ${escapeHtml(v.lang)}</option>`).join('');
}
function refreshVoiceSelect(){
  const select = document.getElementById('voiceSelect');
  if(select) select.innerHTML = voiceOptionsHtml();
}
if('speechSynthesis' in window){
  refreshGermanVoiceCache();
  const handleVoicesChanged = ()=>{ refreshGermanVoiceCache(); refreshVoiceSelect(); };
  if(typeof speechSynthesis.addEventListener==='function') speechSynthesis.addEventListener('voiceschanged', handleVoicesChanged);
  else speechSynthesis.onvoiceschanged = handleVoicesChanged;
}

/* ---------------- Optional answer sounds ---------------- */
function getAudioContext(){
  if(!STATE.settings.sound) return null;
  try{
    const AudioCtx = window.AudioContext || window.webkitAudioContext;
    if(!AudioCtx) return null;
    if(!audioContext) audioContext = new AudioCtx();
    if(audioContext.state==='suspended') audioContext.resume().catch(()=>{});
    return audioContext;
  }catch(e){ return null; }
}
function primeAnswerSound(){ getAudioContext(); }
function tone(ctx, frequency, delay, duration, type, volume){
  const oscillator = ctx.createOscillator();
  const gain = ctx.createGain();
  const start = ctx.currentTime + delay;
  oscillator.type = type;
  oscillator.frequency.setValueAtTime(frequency, start);
  gain.gain.setValueAtTime(0.0001, start);
  gain.gain.exponentialRampToValueAtTime(volume, start + 0.015);
  gain.gain.exponentialRampToValueAtTime(0.0001, start + duration);
  oscillator.connect(gain).connect(ctx.destination);
  oscillator.start(start);
  oscillator.stop(start + duration + 0.03);
}
function playAnswerSound(correct){
  const ctx = getAudioContext();
  if(!ctx) return;
  const volume = Math.max(0, Math.min(1, Number(STATE.settings.soundVolume ?? .7)));
  const style = STATE.settings.soundStyle || 'chime';
  const sounds = {
    chime: correct ? [[523.25,0,.12,'sine',.055],[659.25,.09,.16,'sine',.055]] : [[220,0,.13,'triangle',.045],[164.81,.10,.18,'triangle',.04]],
    piano: correct ? [[392,0,.13,'triangle',.06],[523.25,.10,.18,'triangle',.05]] : [[196,0,.15,'sine',.05],[146.83,.11,.20,'sine',.04]],
    soft: correct ? [[440,0,.18,'sine',.04],[554.37,.12,.22,'sine',.035]] : [[246.94,0,.18,'sine',.035],[185,.13,.24,'sine',.03]]
  };
  (sounds[style] || sounds.chime).forEach(([frequency,delay,duration,type,level])=>tone(ctx,frequency,delay,duration,type,level*volume));
}
function setSoundVolume(value){
  STATE.settings.soundVolume = Math.max(0, Math.min(1, Number(value)||0));
  saveState();
}
function setSoundStyle(value){
  STATE.settings.soundStyle = ['chime','piano','soft'].includes(value) ? value : 'chime';
  saveState(); render();
}
function previewAnswerSound(correct=true){
  primeAnswerSound();
  playAnswerSound(correct);
}
function setSpecialGlowColor(value){
  if(/^#[0-9a-f]{6}$/i.test(value||'')) STATE.settings.specialGlowColor=value;
  saveState();
  render();
}
function setSpecialGlowIntensity(value){
  STATE.settings.specialGlowIntensity = Math.max(20, Math.min(100, Number(value)||72));
  saveState();
  render();
}
function setSpecialGlowSpeed(value){
  STATE.settings.specialGlowSpeed = ['calm','medium','fast'].includes(value) ? value : 'calm';
  saveState();
  render();
}
function setSpecialGlowStyle(value){
  STATE.settings.specialGlowStyle = ['pulse','steady'].includes(value) ? value : 'pulse';
  saveState();
  render();
}
function setVoiceRate(value){
  STATE.settings.voiceRate = Math.max(.6, Math.min(1.2, Number(value)||.9));
  saveState();
}
function setVoiceStyle(value){
  const key = VOICE_STYLES[value] ? value : 'warm';
  STATE.settings.voiceStyle = key;
  STATE.settings.voiceRate = VOICE_STYLES[key].rate;
  saveState();
  render();
}
function setVoiceName(value){
  const chosen = germanVoices().find(v=>v.name===value);
  STATE.settings.voiceName = chosen ? chosen.name : '';
  saveState();
}
function previewGermanVoice(){
  speak('Guten Tag. Willkommen bei 11:11e Deutsch Lernen.');
}

function navigate(name, params={}, replace=false){
  const entry = {name, params};
  if(replace) navStack[navStack.length-1] = entry; else navStack.push(entry);
  current = entry;
  render();
  window.scrollTo(0,0);
}
function goBack(){
  if(navStack.length>1){ navStack.pop(); current = navStack[navStack.length-1]; render(); window.scrollTo(0,0); }
  else navigate('home', {}, true);
}

function toast(msg){
  let t = document.getElementById('toast');
  if(!t){ t=document.createElement('div'); t.id='toast'; t.className='toast'; document.body.appendChild(t); }
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(t._h);
  t._h = setTimeout(()=>t.classList.remove('show'), 1800);
}

function speak(text){
  try{
    if(!('speechSynthesis' in window)) return toast('Speech not supported on this device');
    const u = new SpeechSynthesisUtterance(String(text||''));
    const voice = preferredGermanVoice();
    u.lang = voice ? voice.lang : 'de-DE';
    if(voice) u.voice = voice;
    const style = currentVoiceStyle();
    u.rate = Math.max(.65, Math.min(1.1, Number(STATE.settings.voiceRate || style.rate)));
    u.pitch = style.pitch;
    u.volume = 1;
    speechSynthesis.cancel();
    speechSynthesis.speak(u);
  }catch(e){}
}

function speakGermanWord(wordId, event){
  if(event){ event.preventDefault(); event.stopPropagation(); }
  const currentWord = session && session.words ? session.words.find(w=>w.id===wordId) : null;
  const word = currentWord || wordsAllLevels().find(w=>w.id===wordId);
  if(word) speak(word.de);
}

function applyTheme(){

  document.documentElement.style.setProperty('--gold', accent);

function toggleTheme(){
  STATE.settings.theme = STATE.settings.theme==='dark' ? 'light':'dark';

function setAccentColor(value){
  const accent = String(value||'').toLowerCase();
  if(!/^#[0-9a-f]{6}$/.test(accent)){ toast('Choose a valid accent color'); return; }

}

function renderProgress(el){
  const allWords = wordsAllLevels();
  const stats = allWords.map(w=>STATE.wordStats[w.id]).filter(Boolean);
  const seen = stats.reduce((sum,s)=>sum+s.seen,0);
  const correct = stats.reduce((sum,s)=>sum+s.correct,0);
  const wrong = stats.reduce((sum,s)=>sum+s.wrong,0);
  const mastered = allWords.filter(w=>STATE.wordStats[w.id] && STATE.wordStats[w.id].mastered).length;
  const due = allWords.filter(w=>{
    const s=STATE.wordStats[w.id];
    return s && s.seen>0 && (s.streakWrong>0 || (s.nextReview && Date.now()>=s.nextReview));
  }).length;
  const accuracy = seen ? Math.round(correct/seen*100) : 0;
  const levels = Object.keys(LEVEL_META).filter(level=>allChaptersFor(level).length);
  const chapterRows = levels.flatMap(level=>allChaptersFor(level).map(ch=>{
    const words = wordsForChapter(level,ch.chapter);
    const chapterMastered = words.filter(w=>STATE.wordStats[w.id] && STATE.wordStats[w.id].mastered).length;
    const chapterSeen = words.filter(w=>STATE.wordStats[w.id] && STATE.wordStats[w.id].seen>0).length;
    const chapterDue = words.filter(w=>{
      const s=STATE.wordStats[w.id];
      return s && s.seen>0 && (s.streakWrong>0 || (s.nextReview && Date.now()>=s.nextReview));
    }).length;
    const chapterPct = words.length ? Math.round(chapterMastered/words.length*100) : 0;
    const progress = getChapterProgress(level,ch.chapter);
    const batchStatus = progress.completed ? 'Chapter complete' : progress.currentBatchIds.length ? 'Batch in progress' : isChapterUnlocked(level,ch.chapter) ? 'Ready for next batch' : `Locked until Chapter ${ch.chapter-1}`;
    return `<div class="progress-chapter-row">
      <div class="progress-chapter-head"><span class="progress-chapter-name">${level} · Ch.${ch.chapter} ${escapeHtml(ch.title)}</span><span class="progress-chapter-count">${chapterMastered}/${words.length} mastered</span></div>
      <div class="progress-track"><div class="progress-fill" style="width:${chapterPct}%"></div></div>
      <div class="progress-chapter-foot"><span>${chapterSeen}/${words.length} seen · ${chapterPct}% mastery</span><span class="${chapterDue?'progress-due':'progress-ready'}">${chapterDue?`${chapterDue} due for review`:batchStatus}</span></div>
    </div>`;
  }));
  if(wordsCustom().length){
    const custom = wordsCustom();
    const customMastered = custom.filter(w=>STATE.wordStats[w.id] && STATE.wordStats[w.id].mastered).length;
    const customPct = Math.round(customMastered/custom.length*100);
    chapterRows.push(`<div class="progress-chapter-row"><div class="progress-chapter-head"><span class="progress-chapter-name">My Vocabulary</span><span class="progress-chapter-count">${customMastered}/${custom.length} mastered</span></div><div class="progress-track"><div class="progress-fill" style="width:${customPct}%"></div></div><div class="progress-chapter-foot"><span>Personal word list · ${customPct}% mastery</span><span class="progress-ready">Custom list</span></div></div>`);
  }
  el.innerHTML = `
    <div class="back-row"><button class="back-btn" onclick="goBack()">← Back</button></div>
    <div class="hero" style="padding-top:4px"><div class="eyebrow">Learning analytics</div><h1>Progress Dashboard</h1><p>Track mastery, accuracy, and words scheduled for review.</p></div>
    <div class="progress-overview">
      <div class="progress-stat"><strong>${mastered}</strong><span>Words mastered</span></div>
      <div class="progress-stat"><strong>${accuracy}%</strong><span>Overall accuracy</span></div>
      <div class="progress-stat"><strong>${seen}</strong><span>Words practiced</span></div>
      <div class="progress-stat"><strong>${due}</strong><span>Due for review</span></div>
    </div>
    <div class="progress-section"><div class="section-label">Mastery by chapter</div>${chapterRows.join('') || `<div class="empty-state"><span class="ee">📊</span>Start a game to build your progress dashboard.</div>`}</div>
    <div class="progress-section"><div class="section-label">Answer totals</div><div class="progress-overview"><div class="progress-stat"><strong>${correct}</strong><span>Correct answers</span></div><div class="progress-stat"><strong>${wrong}</strong><span>Incorrect answers</span></div></div></div>
  `;
}

function startRandomAllLevels(){
  const pool = wordsAllLevels();
  if(pool.length===0) return toast('No vocabulary loaded yet');
  studyCtx = { pool, idx:0, levelLabel:'All Levels', source:{type:'randomAll'} };
  navigate('study', {});
}

/* ---------------- Level -> Chapters ---------------- */
function renderLevelChapters(el, level){
  const meta = LEVEL_META[level];
  const chapters = allChaptersFor(level);
  const rows = chapters.map(c=>{
    const total = c.words.length;
    const mastered = c.words.filter(w=>{const s=STATE.wordStats[w.id]; return s&&s.mastered;}).length;
    const pct = total? Math.round(mastered/total*100) : 0;
    const progress = getChapterProgress(level, c.chapter);
    const unlocked = isChapterUnlocked(level, c.chapter);
    const completedCount = progress.completedIds.length;
    const status = progress.completed ? 'Chapter complete · next chapter unlocked' : unlocked
      ? (completedCount ? `${completedCount}/${total} completed · next 15-word batch ready` : 'Unlocked · start with a random 15-word batch')
      : `Locked · finish Chapter ${c.chapter-1} first`;
    return `<button class="chapter-card ${unlocked?'':'locked'}" ${unlocked?'':'disabled'} onclick="openChapter('${level}',${c.chapter})">
      <div class="chapter-num">${c.chapter}</div>
      <div class="chapter-info">
        <div class="ct-title">${escapeHtml(c.title)}</div>
        <div class="ct-sub">${status} · ${pct}% mastered</div>
      </div>
      ${ringSvg(pct)}
    </button>`;
  }).join('') || `<div class="empty-state"><span class="ee">🚧</span>${meta.name} content is coming soon.</div>`;

  el.innerHTML = `
    <div class="back-row">
      <button class="back-btn" onclick="goBack()">← Back</button>
    </div>
    <div class="hero" style="padding-top:0">
      <div class="eyebrow">${appIcon(levelIconName(level))} Level ${level}</div>
      <h1>${meta.name}</h1>
      <p>Complete chapters in order. Each chapter is taught in random 15-word batches.</p>
    </div>
    ${chapters.length ? `<button class="start-game-btn" style="margin-bottom:18px" onclick="openRandomLevel('${level}')">🎲 Random ${level} (all chapters)</button>` : ''}
    <div class="chapter-list">${rows}</div>
  `;
}
function ringSvg(pct){
  const r=14, c=2*Math.PI*r;
  const off = c - (c*pct/100);
  return `<svg class="chapter-progress-ring" viewBox="0 0 34 34">
    <circle cx="17" cy="17" r="${r}" fill="none" stroke="var(--surface-2)" stroke-width="3"/>
    <circle cx="17" cy="17" r="${r}" fill="none" stroke="var(--teal)" stroke-width="3" stroke-linecap="round"
      stroke-dasharray="${c}" stroke-dashoffset="${off}" transform="rotate(-90 17 17)"/>
  </svg>`;
}
function openChapter(level, chapterNum){
  if(!isChapterUnlocked(level, chapterNum)){
    toast(`Finish Chapter ${chapterNum-1} before starting this chapter`);
    return;
  }
  const pool = chapterBatchWords(level, chapterNum);
  if(!pool.length){
    toast('This chapter is complete');
    return;
  }
  const progress = getChapterProgress(level, chapterNum);
  const batchNumber = Math.floor(progress.completedIds.length/15)+1;
  studyCtx = { pool, idx:0, levelLabel:`${level} · Ch.${chapterNum} · Batch ${batchNumber}`, source:{type:'chapter', level, chapter:chapterNum} };
  navigate('study', {});
}
function openRandomLevel(level){
  const pool = wordsForLevel(level);
  studyCtx = { pool, idx:0, levelLabel:`${level} · Random`, source:{type:'randomLevel', level} };
  navigate('study', {});
}

/* ---------------- Study mode ---------------- */
function renderStudy(el){
  if(!studyCtx || studyCtx.pool.length===0){
    el.innerHTML = `<div class="empty-state"><span class="ee">📭</span>No words available here yet.</div>`;
    return;
  }
  // Chapter batches are exactly the words that will appear in the game.
  // Other study screens keep their existing 24-word cap.
  if(!studyCtx.set){
    const isChapterBatch = studyCtx.source && studyCtx.source.type==='chapter';
    const size = isChapterBatch ? studyCtx.pool.length : Math.min(studyCtx.pool.length, 24);
    studyCtx.set = isChapterBatch ? shuffle(studyCtx.pool.slice()) : weightedSample(studyCtx.pool, size, w=>w.id);
    studyCtx.idx = 0;
    studyCtx.startedAt = Date.now();
  }
  const w = studyCtx.set[studyCtx.idx];
  const pct = Math.round(((studyCtx.idx+1)/studyCtx.set.length)*100);
  // Study mode is intentionally untimed; learners can review at their own pace.

  el.innerHTML = `
    <div class="back-row">
      <button class="back-btn" onclick="goBack()">← Back</button>
      <span style="color:var(--text-faint);font-size:.8rem">${studyCtx.levelLabel}</span>
    </div>
    <div class="study-progress-row">
      <div class="study-progress-track"><div class="study-progress-fill" style="width:${pct}%"></div></div>
    </div>
    <div class="study-card-wrap">
      <button class="fav-toggle" onclick="toggleFavorite('${w.id}');render()">${isFavorite(w.id)?'⭐':'☆'}</button>
      <div class="study-card">
        ${w.article?`<div class="study-article">${w.article}${w.gender?' · '+w.gender:''}</div>`:''}
        <div class="study-word">${escapeHtml(w.de)}</div>
        <div class="study-en">${escapeHtml(w.en)}</div>
        <div class="study-audio"><button class="speak-btn" aria-label="Hear German pronunciation" onclick="speakGermanWord('${w.id}',event)">🔊 Hear German</button></div>
        <div class="study-meta">
          ${w.plural?`<span class="study-tag">Pl. ${escapeHtml(w.plural)}</span>`:''}
          ${w.pos?`<span class="study-tag">${escapeHtml(w.pos)}</span>`:''}
          ${w.page?`<span class="study-tag">p.${w.page}</span>`:''}
        </div>
        ${w.ex?`<div class="study-example">“${escapeHtml(w.ex)}”${w.exEn?`<small>${escapeHtml(w.exEn)}</small>`:''}</div>`:''}
      </div>
    </div>
    <div class="study-nav">
      <button class="nav-btn" ${studyCtx.idx===0?'disabled':''} onclick="studyPrev()">‹</button>
      <button class="nav-btn" onclick="studyNext()">›</button>
    </div>
    <button class="start-game-btn" onclick="navigate('modeSelect',{})">▶ Start Game</button>
  `;
  // No Study mode countdown. Game mode timers remain managed by startGameTimer().
}
function studyNext(){
  if(studyCtx.idx < studyCtx.set.length-1){ studyCtx.idx++; render(); }
  else toast('You have reviewed this batch — start the game!');
}
function studyPrev(){ if(studyCtx.idx>0){ studyCtx.idx--; render(); } }

/* ---------------- Mode select ---------------- */
function renderModeSelect(el){
  const modes = ['memory','de2en','en2de','mcq','pairs'];
  el.innerHTML = `
    <div class="back-row"><button class="back-btn" onclick="goBack()">← Back</button></div>
    <div class="hero" style="padding-top:0"><div class="eyebrow">Choose a game</div><h1>${studyCtx.levelLabel}</h1></div>

function launchGame(mode){
