/* ---------------- Game timer ---------------- */
function startGameTimer(){
  clearInterval(timerHandle);
  timerHandle = setInterval(()=>{
    if(!session || session.finished){ clearInterval(timerHandle); return; }
    session.remaining -= 1;
    updateHud();
    if(session.remaining <= 0){
      clearInterval(timerHandle);
      endGame();
    }
  }, 1000);
}
function updateHud(){
  const hud = document.getElementById('gameHud');
  if(!hud) return;
  const low = session.remaining <= 10;
  hud.innerHTML = hudHtml(low);
}
function hudHtml(low){
  const mm = String(Math.floor(Math.max(0,session.remaining)/60)).padStart(2,'0');
  const ss = String(Math.max(0,session.remaining)%60).padStart(2,'0');
  return `
    <div class="hud-group"><div class="hud-pill heart-pill" data-heart-count>${heartMarkup()}</div><div class="hud-pill score">${appIcon('spark')}<span>${session.score}</span></div></div>
    <div class="hud-group">${session.combo>1?`<div class="hud-pill gold">${appIcon('flame')}<span>x${session.combo}</span></div>`:''}<div class="hud-pill timer ${low?'low':''}">${appIcon('refresh')}<span>${mm}:${ss}</span></div></div>
  `;
}

/* ---------------- Game rendering per mode ---------------- */
function renderGame(el){
  if(!session){ navigate('home',{},true); return; }
  const body = session.mode==='memory' ? memoryHtml()
             : session.mode==='pairs' ? pairsHtml()
             : mcqHtml();
  el.innerHTML = `
    <div class="game-hud" id="gameHud">${hudHtml(session.remaining<=10)}</div>
    ${body}
  `;
}

/* --- Memory match --- */
function memoryHtml(){
  const cards = session.cards.map(c=>{
    const flipped = session.cardsFlipped.includes(c.cardId);
    const matched = session.matchedIds.has(c.wordId) && matchedSideShown(c);
    const isGermanCard = c.side==='de' && String(c.cardId||'').endsWith('_de');
    return `<div class="flip-card ${flipped?'flipped':''} ${session.matchedIds.has(c.wordId)?'matched':''}" data-card="${c.cardId}" onclick="flipCard('${c.cardId}')">
      <div class="flip-inner">
        <div class="flip-face flip-front"><img src="${CARD_BACK_IMAGE}" alt="11:11e floral card design"></div>
        <div class="flip-face flip-back"><span class="card-back-text">${escapeHtml(c.text)}</span>${isGermanCard?`<button class="card-speak" aria-label="Hear German pronunciation" onclick="speakGermanWord('${c.wordId}',event)">🔊</button>`:''}</div>
      </div>
    </div>`;
  }).join('');
  const sectionNote = session.memorySection ? `Section ${session.memorySection} of 2 · ` : '';
  return `<div class="memory-round-note"><span>${sectionNote}${session.words.length} words · ${session.cards.length} cards · Match every pair</span>${session.words[0]?`<button class="game-speak-btn" aria-label="Hear a German word from this round" onclick="speakGermanWord('${session.words[0].id}',event)">🔊 Hear German</button>`:''}</div><div class="match-grid" id="matchGrid">${cards}</div>`;
}
function startMemorySection(section){
  if(!session || session.mode!=='memory') return;
  const allWords = Array.isArray(session.memoryAllWords) ? session.memoryAllWords : session.words;
  const sectionWords = allWords.slice((section-1)*5, section*5);
  if(!sectionWords.length){ endGame(); return; }
  session.memorySection = section;
  session.words = sectionWords;
  session.cardsFlipped = [];
  session.matchedIds = new Set();
  session.feedbackLocked = false;
  session.cards = [];
  sectionWords.forEach(w=>{
    session.cards.push({cardId:w.id+'_de', wordId:w.id, text:w.de, side:'de'});
    session.cards.push({cardId:w.id+'_en', wordId:w.id, text:w.en, side:'en'});
  });
  shuffle(session.cards);
  renderGame(document.getElementById('screen'));
  toast(`Section ${section} unlocked — ${sectionWords.length} words`);
}
function matchedSideShown(){ return true; }
function flipCard(cardId){
  if(session.finished || session.feedbackLocked) return;
  primeAnswerSound();
  if(session.cardsFlipped.includes(cardId)) return;
  const card = session.cards.find(c=>c.cardId===cardId);
  if(session.matchedIds.has(card.wordId)) return;
  if(session.cardsFlipped.length>=2) return;
  session.cardsFlipped.push(cardId);
  session.moves++;
  renderGame(document.getElementById('screen'));

  if(session.cardsFlipped.length===2){
    session.feedbackLocked = true;
    const [c1id,c2id] = session.cardsFlipped;
    const c1 = session.cards.find(c=>c.cardId===c1id), c2 = session.cards.find(c=>c.cardId===c2id);
    const isMatch = c1.wordId===c2.wordId && c1.side!==c2.side;
    setTimeout(()=>{
      if(session.finished) return;
      if(isMatch){
        playAnswerSound(true);
        session.matchedIds.add(c1.wordId);
        session.feedbackLocked = false;
        applyCorrect(session, c1.wordId);
        session.cardsFlipped = [];
        renderGame(document.getElementById('screen'));
        if(session.matchedIds.size === session.words.length){
          if(session.memorySection===1 && Array.isArray(session.memoryAllWords) && session.memoryAllWords.length>session.words.length){
            setTimeout(()=>startMemorySection(2), 350);
          } else {
            endGame();
          }
        }
      } else {
        playAnswerSound(false);
        markWrongFlash(c1id, c2id);
        // Memory Match mistakes are recorded but do not consume a heart.
        const remaining = applyWrong(session, c1.wordId===c2.wordId? c1.wordId : (Math.random()<0.5?c1.wordId:c2.wordId), false);
        session.cardsFlipped = [];
        setTimeout(()=>{
          if(session.finished) return;
          session.feedbackLocked = false;
          renderGame(document.getElementById('screen'));
          if(remaining<=0) setTimeout(()=>endGame(),300);
        }, 500);
      }
    }, 550);
  }
}
function markWrongFlash(id1,id2){
  [id1,id2].forEach(id=>{
    const node = document.querySelector(`[data-card="${id}"]`);
    if(node) node.classList.add('wrong');
  });
}

/* --- MCQ / de2en / en2de --- */
function mcqHtml(){
  const q = getCurrentQuestion(session, studyCtx.pool.length>=4 ? studyCtx.pool : wordsAllLevels());
  if(!q){ setTimeout(endGame,0); return '<div></div>'; }
  const dirLabel = q.promptField==='de' ? 'German' : 'English';
  const answered = session.answeredCurrent;
  return `
    <div class="question-card">
      <div class="question-label">Translate this ${dirLabel} word</div>
      <div class="question-word-row"><div class="question-word">${escapeHtml(q.promptText)}</div><button class="question-speak-btn" aria-label="Hear German pronunciation" onclick="speakGermanWord('${q.word.id}',event)">🔊</button></div>
    </div>
    <div class="choice-list" aria-live="polite">
      ${q.choices.map(c=>{
        let cls='';
        if(answered){
          if(c.wordId===q.word.id) cls='correct';
          else if(c._picked) cls='incorrect';
          else cls='dim';
        }
        const stateLabel = answered && c.wordId===q.word.id ? ' (correct answer)' : answered && c._picked ? ' (incorrect answer)' : '';
        return `<button class="choice-btn ${cls}" ${answered?'disabled':''} aria-label="${escapeHtml(c.text + stateLabel)}" onclick="answerMcq('${c.wordId}')">${escapeHtml(c.text)}</button>`;
      }).join('')}
    </div>
  `;
}
let _lastQ = null;
function answerMcq(pickedId){
  const q = getCurrentQuestion(session, studyCtx.pool.length>=4 ? studyCtx.pool : wordsAllLevels());
  if(!q || session.finished || session.answeredCurrent) return;
  primeAnswerSound();
  session.answeredCurrent = true;
  q.choices.forEach(c=>{ if(c.wordId===pickedId) c._picked=true; });
  _lastQ = q;
  const correct = pickedId === q.word.id;
  playAnswerSound(correct);
  session.moves++;
  if(correct) applyCorrect(session, q.word.id);
  const remaining = correct ? STATE.hearts.count : applyWrong(session, q.word.id);
  renderGame(document.getElementById('screen'));
  setTimeout(()=>{
    if(session.finished) return;
    session.answeredCurrent = false;
    session.qIndex++;
    if(!correct && remaining<=0){ endGame(); return; }
    if(session.qIndex >= session.words.length){ endGame(); return; }
    renderGame(document.getElementById('screen'));
  }, 850);
}

/* --- Word pairs --- */
function pairsHtml(){
  const left = session.pairLeft.map(p=>{
    const matched = session.pairMatched.has(p.wordId);
    const selected = session.pairSelectedLeft && session.pairSelectedLeft.wordId===p.wordId;
    const wrong = session.pairWrong && session.pairWrong.left===p.wordId;
    return `<div class="pair-choice-row"><button class="pair-item ${matched?'matched':''} ${selected?'selected':''} ${wrong?'wrong':''}" ${matched?'disabled':''} onclick="pickPair('left','${p.wordId}')">${escapeHtml(p.text)}</button><button class="pair-speak-btn" aria-label="Hear German pronunciation" onclick="speakGermanWord('${p.wordId}',event)">🔊</button></div>`;
  }).join('');
  const right = session.pairRight.map(p=>{
    const matched = session.pairMatched.has(p.wordId);
    const selected = session.pairSelectedRight && session.pairSelectedRight.wordId===p.wordId;
    const wrong = session.pairWrong && session.pairWrong.right===p.wordId;
    return `<button class="pair-item ${matched?'matched':''} ${selected?'selected':''} ${wrong?'wrong':''}" ${matched?'disabled':''} onclick="pickPair('right','${p.wordId}')">${escapeHtml(p.text)}</button>`;
  }).join('');
  return `<div class="pair-cols"><div>${left}</div><div>${right}</div></div>`;
}
function pickPair(side, wordId){
  if(session.finished || session.pairWrong || session.pairMatched.has(wordId)) return;
  primeAnswerSound();
  const item = (side==='left'?session.pairLeft:session.pairRight).find(p=>p.wordId===wordId);
  if(side==='left') session.pairSelectedLeft = item; else session.pairSelectedRight = item;
  renderGame(document.getElementById('screen'));
  if(session.pairSelectedLeft && session.pairSelectedRight){
    session.moves++;
    const leftId = session.pairSelectedLeft.wordId;
    const rightId = session.pairSelectedRight.wordId;
    const match = leftId === rightId;
    if(match){
      playAnswerSound(true);
      session.pairMatched.add(leftId);
      session.pairWrong = null;
      applyCorrect(session, leftId);
      session.pairSelectedLeft = null; session.pairSelectedRight = null;
      renderGame(document.getElementById('screen'));
      if(session.pairMatched.size===session.words.length) endGame();
    } else {
      playAnswerSound(false);
      session.pairWrong = {left:leftId, right:rightId};
      const remaining = applyWrong(session, leftId);
      renderGame(document.getElementById('screen'));
      setTimeout(()=>{
        if(session.finished) return;
        session.pairSelectedLeft=null; session.pairSelectedRight=null;
        session.pairWrong=null;
        renderGame(document.getElementById('screen'));
        if(remaining<=0) setTimeout(endGame,300);
      },700);
    }
  }
}

/* ---------------- End game / results ---------------- */
function isChapterBatchFinished(game){
  const source = game && game.meta && game.meta.chapterSource;
  if(!source || source.type!=='chapter') return false;
  if(game.mode==='memory') return game.matchedIds.size===game.words.length;
  if(game.mode==='pairs') return game.pairMatched.size===game.words.length;
  return game.qIndex >= game.words.length;
}

function finalizeChapterBatch(game){
  if(!isChapterBatchFinished(game)) return null;
  const source = game.meta.chapterSource;
  const chapterWords = wordsForChapter(source.level, source.chapter);
  const progress = getChapterProgress(source.level, source.chapter);
  const completed = new Set(progress.completedIds);
  const completedWords = game.mode==='memory' && Array.isArray(game.memoryAllWords) ? game.memoryAllWords : game.words;
  completedWords.forEach(w=>completed.add(w.id));
  progress.completedIds = chapterWords.filter(w=>completed.has(w.id)).map(w=>w.id);
  progress.currentBatchIds = [];
  const hasUnresolvedMistakes = chapterWords.some(w=>{
    const s = STATE.wordStats[w.id];
    return !s || s.streakWrong>0;
  });
  progress.completed = progress.completedIds.length>=chapterWords.length && !hasUnresolvedMistakes;
  saveState();
  game.chapterBatchFinished = progress.completed ? 'chapter' : 'batch';
  return game.chapterBatchFinished;
}

function continueChapterBatch(){
  if(!session || !session.chapterBatchFinished) return;
  const source = session.meta.chapterSource;
  if(session.chapterBatchFinished==='chapter'){
    navigate('levelChapters', {level:source.level}, true);
    toast(`${source.level} Chapter ${source.chapter} complete — next chapter unlocked`);
    return;
  }
  openChapter(source.level, source.chapter);
}

function endGame(){
  clearInterval(timerHandle);
  if(session.finished) return;
  finalizeChapterBatch(session);
  finishSession(session);
  navigate('result', {}, true);
}

function hexToRgba(hex, alpha){
  const value = String(hex||'').replace('#','');
  const r=parseInt(value.slice(0,2),16), g=parseInt(value.slice(2,4),16), b=parseInt(value.slice(4,6),16);
  return `rgba(${Number.isFinite(r)?r:214},${Number.isFinite(g)?g:176},${Number.isFinite(b)?b:94},${alpha})`;
}
function specialGlowVars(){
  const color = /^#[0-9a-f]{6}$/i.test(STATE.settings.specialGlowColor||'') ? STATE.settings.specialGlowColor : '#d6b05e';
  const intensity = Math.max(20, Math.min(100, Number(STATE.settings.specialGlowIntensity)||72));
  const factor = intensity / 100;
  const speed = {calm:'3.8s', medium:'2.8s', fast:'1.9s'}[STATE.settings.specialGlowSpeed] || '3.8s';

function saveProfileName(event){
  if(event) event.preventDefault();
  if(STATE.profile.nameLocked){ toast('Your name is already saved'); return; }
  const input = document.getElementById('profileNameInput');
  const name = input ? input.value.trim().replace(/\s+/g,' ').slice(0,24) : '';
  if(!name){ toast('Please enter a name'); return; }
  STATE.profile.name = name;
  STATE.profile.avatarLetter = Array.from(name)[0].toLocaleUpperCase();
  STATE.profile.nameLocked = true;
  saveState();
  render();
  toast('Name saved');
}

function saveProfilePhoto(file){
  if(!file) return;
  if(!/^image\/(png|jpeg|webp)$/.test(file.type)){
    toast('Please choose a PNG, JPEG, or WebP image');
    return;
  }
  const reader = new FileReader();
  reader.onload = ()=>{
    if(String(reader.result).length > 1500000){
      toast('Please choose a smaller photo');
      return;
    }
    STATE.profile.avatarData = reader.result;
    saveState(); render(); toast('Profile photo saved');
  };
  reader.onerror = ()=>toast('Could not read that photo');
  reader.readAsDataURL(file);
}

function clearProfilePhoto(){
  STATE.profile.avatarData = null;
  saveState(); render(); toast('Profile photo removed');
}

/* ---------------- Search (works fully offline) ---------------- */
function highlightSearchMatch(text, query){
  const safe = escapeHtml(text||'');
  const safeQuery = escapeHtml(String(query||''));
  if(!safeQuery) return safe;
  const pattern = safeQuery.replace(/[.*+?^${}()|[\\]\\\\]/g,'\\\\$&');
  return safe.replace(new RegExp(pattern,'gi'), match=>`<mark class="search-highlight">${match}</mark>`);
}
function renderSearch(el){
  el.innerHTML = `
    <div class="hero" style="padding-top:4px"><div class="eyebrow">Vocabulary lookup</div><h1>Search</h1><p>Search in German or English to see every related detail.</p></div>
    <input id="searchInput" placeholder="Search German or English…" style="width:100%;padding:14px;border-radius:12px;background:var(--surface);border:1px solid var(--line);color:var(--text);font-size:1rem;margin-bottom:16px;" oninput="doSearch(this.value)">
    <div id="searchResults"></div>
  `;
  document.getElementById('searchInput').focus();
}
function doSearch(q){
  const res = document.getElementById('searchResults');
  const query = String(q||'').trim();
  if(query.length<2){ res.innerHTML=''; return; }
  const ql = query.toLocaleLowerCase();
  const hits = wordsAllLevels().filter(w=> w.de.toLocaleLowerCase().includes(ql) || w.en.toLocaleLowerCase().includes(ql)).slice(0,80);
  res.innerHTML = hits.length ? hits.map(w=>{
    const germanHit = w.de.toLocaleLowerCase().includes(ql);
    const englishHit = w.en.toLocaleLowerCase().includes(ql);
    const detail = [w.article, w.gender, w.plural, w.pos, w.page?`Page ${w.page}`:''].filter(Boolean).join(' · ');
    const example = w.ex ? `<div class="search-example">“${escapeHtml(w.ex)}”${w.exEn?`<small>${escapeHtml(w.exEn)}</small>`:''}</div>` : '';
    return `<div class="search-result-row">
      <div class="search-result-main">
        <div class="search-result-head"><div class="de">${highlightSearchMatch(w.de,query)}</div><span class="search-match-badge">${germanHit&&englishHit?'German + English':germanHit?'German match':'English match'}</span></div>
        <div class="en"><strong>English:</strong> ${highlightSearchMatch(w.en,query)}</div>
        ${detail?`<div class="search-details">${escapeHtml(detail)}</div>`:''}
        <div class="search-location">${escapeHtml(w.level)} · Chapter ${w.chapter} · ${escapeHtml(w.chapterTitle||'')}</div>
        ${example}
      </div>
      <div class="wr-side"><button class="star-btn" aria-label="Favorite ${escapeHtml(w.de)}" onclick="toggleFavorite('${w.id}');render()">${isFavorite(w.id)?'⭐':'☆'}</button></div>
    </div>`;
  }).join('') : `<div class="empty-state"><span class="ee">🔍</span>No German or English matches</div>`;
}

/* ---------------- utils ---------------- */
function escapeHtml(s){
  return String(s).replace(/[&<>"']/g, m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
}

  applyTheme();
  render();
  startHeartRegeneration();
}
